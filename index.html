  }
  Sheet.open(h+`</div>`);
}
/* 「スミスマシーン」と打っても「スミスマシン」が出るように、
   伸ばし棒・中黒・空白を無視して比べる */
const normName=s=>String(s).replace(/[ー―‐・\s]/g,'').toLowerCase();
function filterPick(q){
  q=normName(q.trim());
  document.querySelectorAll('#picklist .pk-i').forEach(el=>{
    const hit=!q||normName(el.dataset.n).includes(q)||normName(el.dataset.a||'').includes(q);
    el.style.display=hit?'':'none'});
  document.querySelectorAll('#picklist .pk').forEach(g=>{g.style.display=[...g.querySelectorAll('.pk-i')].some(i=>i.style.display!=='none')?'':'none'});
}

function addEntry(exId){
  const w=getWorkout(VIEW_DATE,true);
  if(w.entries.some(e=>e.exerciseId===exId)){Sheet.close();render();return}
  const prev=lastRecord(exId,VIEW_DATE);
  /* バドミントンなどの有酸素は「3セット」ではなく1行（合計何分やったか）で記録する */
  const blank=isCardioTime(exById(exId))?1:3;
  const sets=prev?prev.sets.slice(0,4).map(s=>({w:'',r:'',ph:{w:s.w,r:s.r},done:false}))
                 :Array.from({length:blank},()=>({w:'',r:'',done:false}));
  w.entries.push({exerciseId:exId,sets});saveWO();Sheet.close();render();
}
function rmEntry(exId){const w=getWorkout(VIEW_DATE);if(!w)return;
  w.entries=w.entries.filter(e=>e.exerciseId!==exId);cleanup();render()}
function addSet(exId){const w=getWorkout(VIEW_DATE),en=w.entries.find(e=>e.exerciseId===exId);
  const last=en.sets[en.sets.length-1]||{};
  const ph=(last.w!==''&&last.w!=null)?{w:last.w,r:last.r}:(last.ph||null);
  en.sets.push({w:'',r:'',ph,done:false});saveWO();render()}
function rmSet(exId,i){const w=getWorkout(VIEW_DATE),en=w.entries.find(e=>e.exerciseId===exId);
  en.sets.splice(i,1);if(!en.sets.length)en.sets.push({w:'',r:'',done:false});saveWO();render()}
/* 入力は type="text" ＋ 自前の整形。
   type="number" だと「42.」の途中状態で value が空になり、
   小数点のある重量（42.5 など）が入らないブラウザがあるため。 */
function setVal(exId,i,f,el){
  const isEl=el&&typeof el==='object';
  let v=String(isEl?el.value:el);
  v=v.replace(/[^\d.]/g,'');                 // 数字と小数点だけ
  const p=v.split('.');
  if(p.length>2)v=p[0]+'.'+p.slice(1).join('');   // 小数点は1つまで
  const w=getWorkout(VIEW_DATE),en=w.entries.find(e=>e.exerciseId===exId);
  const ex=exById(exId);
  if(f==='r'&&ex&&ex.unit==='kg')v=v.replace(/\./g,'');  // 回数は整数
  if(isEl&&v!==el.value){                    // 弾いた文字があればカーソルを保ったまま直す
    const pos=Math.max(0,(el.selectionStart||v.length)-1);
    el.value=v;try{el.setSelectionRange(pos,pos)}catch(e){}
  }
  en.sets[i][f]=v;saveWO();
}
function toggle(exId,i){
  const w=getWorkout(VIEW_DATE),en=w.entries.find(e=>e.exerciseId===exId),s=en.sets[i];
  const ex=exById(exId);
  if(!s.done){
    // 空欄なら前回値（グレー表示）をそのまま確定する
    if(s.ph){if(s.w===''||s.w==null)s.w=s.ph.w;if(s.r===''||s.r==null)s.r=s.ph.r}
    // 中身が無いまま完了にすると、空のセットが履歴に残ってしまう
    const noR=(s.r===''||s.r==null), noW=(s.w===''||s.w==null);
    if(noR||(ex.unit==='kg'&&noW)){
      toast(ex.unit==='time'?'秒数を入れてから ✓ を押してください'
           :ex.unit==='bw' ?'回数を入れてから ✓ を押してください'
                            :'重量と回数を入れてから ✓ を押してください');
      render();
      // 足りていない方の入力欄にカーソルを置く
      const rows=document.querySelectorAll('.setrow');
      const row=[...rows].find(r=>r.dataset.ex===exId&&+r.dataset.i===i);
      if(row){const t=row.querySelector('input');if(t)t.focus()}
      return;
    }
    const before=bestSet(exId);
    s.done=true;
    if(!w.started)w.started=nowHM();   // 最初の1セットで開始時刻を記録
    saveWO();
    const after=bestSet(exId);
    if(after&&(!before||after.w>before.w||after.r>before.r)&&(+s.w||+s.r))
      toast(`🎉 自己ベスト更新！ ${esc(ex.name)} ${bestLabel(ex,after)}`);
    const rest=restFor(ex.part);
    if(rest>0)Timer.start(rest);
  }else{s.done=false;saveWO()}
  render();
}
let toastT=null;
function toast(msg){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.innerHTML=msg;el.classList.add('on');
  navigator.vibrate&&navigator.vibrate(60);
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),3200);
}
function setMemo(v){const w=getWorkout(VIEW_DATE,true);w.memo=v;saveWO()}
function copyLast(){
  const src=WO.find(x=>x.date<VIEW_DATE&&x.entries.length);if(!src)return;
  const w=getWorkout(VIEW_DATE,true);
  for(const en of src.entries){if(w.entries.some(e=>e.exerciseId===en.exerciseId))continue;
    w.entries.push({exerciseId:en.exerciseId,sets:en.sets.map(s=>({w:'',r:'',ph:{w:s.w,r:s.r},done:false}))})}
  saveWO();render();
}
function cleanup(){
  WO=WO.filter(w=>w.entries.length||(w.memo||'').trim()||w.partOverride
                 ||(w.wuDone&&w.wuDone.length)||w.wuOpen!==undefined);
  saveWO();
}

/* ================= 体重 ================= */
/* 「7:05」形式の現在時刻 */
const nowHM=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const hm2min=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const min2hm=v=>Math.floor(v/60)+':'+String(Math.round(v%60)).padStart(2,'0');
/* いつも測っている時間帯（中央値）。ばらつきの判断に使う */
/* 体重タブの日付移動（付け忘れの後書き用）。未来へは行かない */
function wtGo(d){
  const nx=dstr(new Date(dObj(WT_DATE).getTime()+d*86400000));
  if(nx>todayStr())return;
  WT_DATE=nx;render();
}
function wtUsualTime(){
  const mins=Object.values(WT).map(x=>hm2min(x.t)).filter(v=>v!=null).sort((a,b)=>a-b);
  if(mins.length<3)return null;
  return mins[Math.floor(mins.length/2)];
}
function wtSorted(){return Object.keys(WT).sort()
  .map(d=>({d,w:+WT[d].w,f:WT[d].f?+WT[d].f:null,t:WT[d].t||null})).filter(x=>x.w>0)}
function movAvg(arr,n){
  return arr.map((p,i)=>{const s=arr.slice(Math.max(0,i-n+1),i+1);return{d:p.d,w:s.reduce((a,b)=>a+b.w,0)/s.length}});
}
function viewWt(){
  const all=wtSorted(),today=todayStr(),cur=WT[today];
  const last=all[all.length-1];
  const goal=+CF.goal||0;
  const streak=wtStreak();
  let h=`<header><h1>体重</h1><div class="meta">${
    streak>1?`${streak}日連続 ／ `:''}${all.length}日ぶん</div></header>`;

  // 現在値
  const latest=last?last.w:null;
  const prev=all.length>1?all[all.length-2].w:null;
  const diff=latest!=null&&prev!=null?latest-prev:null;
  const avg7=all.length?movAvg(all,7).slice(-1)[0].w:null;
  const ago30=(()=>{const t=dstr(new Date(Date.now()-30*86400000));
    const c=all.filter(x=>x.d<=t);return c.length?c[c.length-1].w:null})();
  const d30=latest!=null&&ago30!=null?latest-ago30:null;
  const sign=v=>(v>0?'+':'')+v.toFixed(1);

  h+=`<div class="card" style="text-align:center;padding:18px 13px">
    <div class="sub">${last?fmtD(last.d)+(last.t?` ${last.t}`:'')+' 時点':'まだ記録がありません'}</div>
    <div style="font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15">
      ${latest!=null?latest.toFixed(1):'—'}<span style="font-size:17px;color:var(--sub)"> kg</span></div>
    ${diff!=null?`<div class="sub" style="color:${diff<0?'var(--ok)':diff>0?'var(--warn)':'var(--sub)'}">前回比 ${sign(diff)}kg</div>`:''}
    ${(()=>{const b=bmiOf(latest);
      /* 身長が入っていないとBMIは出せない。出ない理由と入れ場所をその場に書いておく */
      if(b==null)return latest!=null&&!CF.height
        ?`<div class="sub" style="font-size:11.5px;margin-top:6px">
            <a href="#" onclick="openBody();return false" style="color:var(--accent)">身長を入れる</a>とBMIが出ます</div>`:'';
      return `<div class="sub" style="margin-top:6px">BMI <b style="color:var(--fg)">${b.toFixed(1)}</b>（${bmiLabel(b)}）</div>`})()}
  </div>`;

  h+=`<div class="row" style="gap:10px;margin-bottom:11px">
    <div class="card grow" style="margin:0;text-align:center;padding:11px 6px"><div class="sub" style="font-size:11px">7日平均</div>
      <b style="font-size:17px">${avg7!=null?avg7.toFixed(1):'—'}</b></div>
    <div class="card grow" style="margin:0;text-align:center;padding:11px 6px"><div class="sub" style="font-size:11px">30日前比</div>
      <b style="font-size:17px;color:${d30==null?'':d30<0?'var(--ok)':'var(--warn)'}">${d30!=null?sign(d30):'—'}</b></div>
    <div class="card grow" style="margin:0;text-align:center;padding:11px 6px"><div class="sub" style="font-size:11px">目標まで</div>
      <b style="font-size:17px">${goal&&latest!=null?sign(goal-latest):'—'}</b></div>
  </div>`;

  // 入力（測り忘れた日に後から書けるよう、日付を行き来できる）
  const wd=WT_DATE,wdToday=wd===today,curD=WT[wd];
  const val=curD?(+curD.w).toFixed(1):(latest!=null?latest.toFixed(1):'');
  h+=`<div class="card">
    <div class="row" style="gap:8px;margin-bottom:8px">
      <button class="howto" onclick="wtGo(-1)">‹ 前の日</button>
      <div class="grow sub" style="text-align:center">${fmtD(wd)} の体重${curD?'（記録済み）':''}${wdToday?'':'<br><span style="color:var(--warn);font-size:11px">過去の日に記録します</span>'}</div>
      ${wdToday?'':`<button class="howto" onclick="wtGo(1)">›</button>
      <button class="howto" onclick="WT_DATE=todayStr();render()">今日へ</button>`}
    </div>
    <div class="step">
      <button onclick="wtStep(-0.1)">−</button>
      <input id="wtin" type="number" inputmode="decimal" step="0.1" placeholder="00.0" value="${val}">
      <button onclick="wtStep(0.1)">＋</button>
    </div>
    <div class="row" style="margin-top:9px">
      <input id="wtfat" type="number" inputmode="decimal" step="0.1" placeholder="体脂肪率 %（任意）" value="${curD&&curD.f?curD.f:''}" style="flex:1">
    </div>
    <div style="margin-top:9px"><button class="btn" onclick="wtSave()">${curD?'更新する':'記録する'}</button></div>
  </div>`;

  // グラフ
  h+=`<h2 class="sec">推移</h2>
    <div class="card">
      <div class="seg" style="margin-bottom:10px">
        ${[[30,'30日'],[90,'90日'],[9999,'全期間']].map(([v,l])=>
          `<button class="${CF.wrange===v?'on':''}" onclick="CF.wrange=${v};saveCF();render()">${l}</button>`).join('')}
      </div>
      ${wtChart(CF.wrange)}
      <div class="row" style="justify-content:center;gap:16px;margin-top:6px">
        <span class="sub"><span style="display:inline-block;width:14px;height:2.5px;background:var(--accent);vertical-align:middle"></span> 体重</span>
        <span class="sub"><span style="display:inline-block;width:14px;height:2px;background:var(--ok);vertical-align:middle"></span> 7日平均</span>
        ${goal?`<span class="sub"><span style="display:inline-block;width:14px;height:2px;background:var(--warn);vertical-align:middle"></span> 目標</span>`:''}
      </div>
    </div>`;

  if(all.length){
    const usual=wtUsualTime();
    h+=`<h2 class="sec">記録一覧</h2>
      ${usual!=null?`<div class="sub" style="margin:-4px 2px 8px;font-size:11.5px">いつもの計測時間は ${min2hm(usual)} ごろ。2時間以上ずれた日には印が付きます。</div>`:''}
      <div class="card">`;
    for(const p of all.slice().reverse().slice(0,30)){
      const idx=all.findIndex(x=>x.d===p.d),pv=idx>0?all[idx-1].w:null,df=pv!=null?p.w-pv:null;
      /* いつもの時間から2時間以上ずれた計測は、体重の差がそのせいかもしれないので印を付ける */
      const off=usual!=null&&p.t!=null&&Math.abs(hm2min(p.t)-usual)>=120;
      h+=`<div class="hist"><div class="d">${fmtD(p.d)}</div>
        <div class="grow"><b style="font-variant-numeric:tabular-nums">${p.w.toFixed(1)}kg</b>
          ${p.f?`<span class="sub"> / 体脂肪 ${p.f}%</span>`:''}
          ${df!=null?`<span class="sub" style="color:${df<0?'var(--ok)':df>0?'var(--warn)':'var(--sub)'}"> ${sign(df)}</span>`:''}
          ${p.t?`<div class="sub" style="font-size:11.5px;font-variant-numeric:tabular-nums${off?';color:var(--warn)':''}">${
            esc(p.t)}${off?' ・いつもと違う時間':''}</div>`:''}</div>
        <button class="del sub" onclick="wtDel('${p.d}')" style="font-size:18px">×</button></div>`;
    }
    h+=`</div>`;
  }
  return h;
}
/* ================= 体重の測り忘れ防止 =================
   iOSのPWAは決まった時刻に通知を出せないので、アプリを開いた時点で
   「今日はまだ」と気づける＆その場で3秒で入力できる形にしている。
   7時に思い出す仕組み自体は、iPhoneのショートカット（オートメーション）側で作る */
let WT_HIDE=false;

/* 体重の連続記録日数。今日がまだでも、昨日まで続いていれば継続とみなす */
function wtStreak(){
  const set=new Set(Object.keys(WT).filter(d=>+WT[d].w>0));
  if(!set.size)return 0;
  const t=todayStr();
  let cur=set.has(t)?t:dstr(new Date(Date.now()-86400000));
  if(!set.has(cur))return 0;
  let n=0;
  while(set.has(cur)){n++;cur=dstr(new Date(dObj(cur).getTime()-86400000))}
  return n;
}

function wtNudge(){
  if(VIEW_DATE!==todayStr()||WT[todayStr()]||WT_HIDE)return '';
  const last=wtSorted().slice(-1)[0];
  const st=wtStreak();
  const ph=last?last.w.toFixed(1):'';
  return `<div class="card" style="border:1px solid var(--accent)">
    <div class="row" style="margin-bottom:10px">
      <div class="grow">
        <b>今日の体重がまだです</b>
        <div class="sub" style="font-size:11.5px;margin-top:2px">${
          st?`${st}日連続で記録中。今日で${st+1}日目です`
            :'起床後・トイレ後に測るとブレません'}</div>
      </div>
      <button class="howto" onclick="WT_HIDE=true;render()">あとで</button>
    </div>
    <div class="row" style="gap:8px">
      <button class="howto" onclick="wtQStep(-0.1)">−</button>
      <input id="wtq" class="grow" type="number" inputmode="decimal" step="0.1"
        style="text-align:center" placeholder="${ph||'体重'}" value="${ph}">
      <button class="howto" onclick="wtQStep(0.1)">＋</button>
      <button class="btn" style="width:auto;padding:11px 17px" onclick="wtQSave()">記録</button>
    </div>
  </div>`;
}
function wtQStep(d){
  const el=document.getElementById('wtq');
  el.value=((+el.value||+el.placeholder||60)+d).toFixed(1);
}
function wtQSave(){
  const v=+document.getElementById('wtq').value;
  if(!v||v<=0||v>400){alert('体重を入力してください');return}
  WT[todayStr()]={w:+v.toFixed(1),t:nowHM()};saveWT();
  const st=wtStreak();
  toast(st>1?`体重を記録しました 🎉 ${st}日連続`:'体重を記録しました');
  render();
}

/* ========== 朝ウォーキング ========== */
function walkSorted(){return Object.keys(WALK).sort()
  .map(d=>({d,min:+WALK[d].min||0,km:WALK[d].km?+WALK[d].km:null,t:WALK[d].t||null}))
  .filter(x=>x.min>0)}
function walkStreak(){
  const set=new Set(walkSorted().map(x=>x.d));
  if(!set.size)return 0;
  const t=todayStr();
  let cur=set.has(t)?t:dstr(new Date(Date.now()-86400000));
  if(!set.has(cur))return 0;
  let n=0;while(set.has(cur)){n++;cur=dstr(new Date(dObj(cur).getTime()-86400000))}
  return n;
}
function walkWeekMin(){
  const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-b.getDay());
  const from=dstr(b);let m=0;
  for(const x of walkSorted())if(x.d>=from)m+=x.min;
  return m;
}

/* ---- 消費カロリー ----
   METs法： kcal ＝ METs × 体重kg × 時間h × 1.05
   距離を入れていれば「速さ」からMETsを決める。無ければ、ふつうの朝散歩にあたる 3.5 とみなす。
   あくまで目安の数字です（同じ距離でも体重と速さで実際はかなり変わります）。 */
const WALK_MET=[[3.2,2.0],[4.0,2.8],[4.8,3.0],[5.6,3.5],[6.4,4.3],[7.2,5.0],[8.0,6.3]];
function walkMet(min,km){
  if(!min||!km)return 3.5;
  const kmh=km/(min/60);
  for(const [lim,met] of WALK_MET)if(kmh<lim)return met;
  return 8.0;   // 8km/h超はもう小走りの領域
}
/* その日の体重。記録があればその日以前の最新のもの、1つも無ければ 60kg を仮に使う */
function bodyWAt(date){
  const a=wtSorted();
  if(!a.length)return 60;
  const p=a.filter(x=>x.d<=date);
  return (p.length?p[p.length-1]:a[0]).w;
}
const hasBodyW=()=>wtSorted().length>0;
function walkKcal(min,km,date){
  if(!min||min<=0)return 0;
  return Math.round(walkMet(min,km)*bodyWAt(date||todayStr())*(min/60)*1.05);
}
/* 歩数の目安。距離があれば歩幅70cm、無ければ速歩きの毎分110歩で見積もる */
const walkSteps=(min,km)=>Math.round(km?km*1000/0.7:min*110);
/* 脂肪1kg ≒ 7200kcal */
const kcalFat=k=>k/7200;
const walkWeekKcal=()=>{
  const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-b.getDay());
  const from=dstr(b);let k=0;
  for(const x of walkSorted())if(x.d>=from)k+=walkKcal(x.min,x.km,x.d);
  return k;
};
const walkTotalKcal=()=>walkSorted().reduce((a,x)=>a+walkKcal(x.min,x.km,x.d),0);
/* 記録タブのカード。今日ぶんの入力＋今週合計＋連続日数＋直近の記録 */
let WALK_OPEN=false;   // 記録済みのとき、畳んだカードを開いているか
function walkCard(date){
  if(date!==todayStr())return '';   // 今日を見ているときだけ
  const cur=WALK[todayStr()],all=walkSorted();
  const st=walkStreak(),wk=walkWeekMin();
  const last=all.slice(-1)[0];
  const ph=cur?cur.min:(last?last.min:'');
  /* 今日ぶんを記録済みなら1行に畳む。直したいときだけタップで開く */
  if(cur&&!WALK_OPEN){
    const kc=walkKcal(cur.min,cur.km);
    return `<div class="card row" style="cursor:pointer" onclick="WALK_OPEN=true;render()">
      <span class="grow" style="font-size:13.5px">🚶 朝ウォーキング <b>${cur.min}分</b>${cur.km?` / ${cur.km}km`:''}
        <span style="color:var(--accent);font-weight:600"> 約${kc}kcal</span>
        <span style="color:var(--ok)"> ✓</span></span>
      <span class="sub" style="font-size:11.5px">今週${wk}分</span>
      <span class="sub">›</span></div>`;
  }
  let h=`<div class="card"${cur?'':' style="border:1px solid var(--accent)"'}>
    <div class="row" style="margin-bottom:9px">
      <div class="grow"><b>🚶 朝ウォーキング</b>
        <div class="sub" style="font-size:11.5px;margin-top:2px">${
          cur?`今日 ${cur.min}分${cur.km?' / '+cur.km+'km':''}${cur.t?'（'+cur.t+'）':''} 記録済み`
            :st?`${st}日連続。今日で${st+1}日目です`:'今日の歩いた時間を記録できます'}</div>
      </div>
      ${(st||wk)?`<div style="text-align:right"><div class="sub" style="font-size:11px">今週</div>
        <b style="font-variant-numeric:tabular-nums">${wk}<span class="sub" style="font-size:11px">分</span></b>
        <div class="sub" style="font-size:11px;font-variant-numeric:tabular-nums">${walkWeekKcal()}kcal</div></div>`:''}
    </div>
    <div class="row" style="gap:8px">
      <button class="howto" onclick="walkStep(-5)">−5</button>
      <input id="walkMin" class="grow" type="text" inputmode="numeric" enterkeyhint="done"
        style="text-align:center" placeholder="${ph||'分'}" value="${cur?cur.min:''}" oninput="walkClean(this)">
      <span class="sub">分</span>
      <button class="howto" onclick="walkStep(5)">＋5</button>
      <button class="btn" style="width:auto;padding:11px 15px" onclick="walkSave()">${cur?'更新':'記録'}</button>
    </div>
    <div class="row" style="gap:8px;margin-top:8px">
      <input id="walkKm" type="text" inputmode="decimal" enterkeyhint="done" class="grow"
        placeholder="距離 km（任意）" value="${cur&&cur.km?cur.km:''}" oninput="walkCleanKm(this)">
    </div>
    <div id="walkCalc" style="margin-top:9px">${walkCalcHTML(cur?cur.min:0,cur&&cur.km?cur.km:null)}</div>`;
  if(all.length){
    h+=`<div class="sub" style="font-size:11px;margin:11px 0 3px">最近の記録</div>`;
    for(const x of all.slice().reverse().slice(0,5)){
      h+=`<div class="row" style="padding:6px 0;border-top:1px solid var(--line);font-size:13px">
        <span class="grow">${fmtD(x.d)}${x.t?` <span class="sub">${x.t}</span>`:''}</span>
        <span style="font-variant-numeric:tabular-nums">${x.min}分${x.km?` / ${x.km}km`:''}
          <span class="sub">約${walkKcal(x.min,x.km,x.d)}kcal</span></span>
        <button class="del sub" onclick="walkDel('${x.d}')" style="font-size:16px;margin-left:8px">×</button></div>`;
    }
    /* 積み上がっている実感が出るように、通算も出す */
    const tk=walkTotalKcal(),fat=kcalFat(tk);
    h+=`<div class="sub" style="font-size:11.5px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)">
      通算 ${all.length}回・${all.reduce((a,x)=>a+x.min,0)}分・<b style="color:var(--fg)">${tk.toLocaleString()}kcal</b>
      ${fat>=0.1?`（脂肪 約${fat.toFixed(1)}kg ぶん）`:''}</div>`;
  }
  return h+`</div>`;
}
/* 入力中の数字から、その場で消費カロリーを出して見せる部分。
   数字が増えるのが見えるほうが続くので、保存前から更新する。 */
function walkCalcHTML(min,km){
  if(!min||min<=0)return `<div class="sub" style="font-size:11.5px">時間を入れると消費カロリーの目安が出ます</div>`;
  const kc=walkKcal(min,km),steps=walkSteps(min,km);
  return `<div class="row" style="gap:10px;background:var(--card2);border-radius:11px;padding:9px 12px">
      <div class="grow">
        <span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)">${kc}</span>
        <span class="sub" style="font-size:12px"> kcal</span>
        <span class="sub" style="font-size:11.5px">　約${steps.toLocaleString()}歩${km?`　${(km/(min/60)).toFixed(1)}km/h`:''}</span>
      </div>
    </div>
    <div class="sub" style="font-size:11px;margin-top:5px">
      ${hasBodyW()?`体重${bodyWAt(todayStr()).toFixed(1)}kgで計算`:'体重が未記録なので60kgで仮計算しています'}${km?'':'・速さは「ふつうの朝散歩」とみなした目安'}
    </div>`;
}
/* 分・kmのどちらを触っても、その場で計算し直す */
function walkCalcRefresh(){
  const box=document.getElementById('walkCalc');if(!box)return;
  /* 実際に保存される値だけで計算する（空欄なら placeholder は使わない） */
  const min=+document.getElementById('walkMin').value||0;
  const km=+document.getElementById('walkKm').value||null;
  box.innerHTML=walkCalcHTML(min,km);
}
function walkClean(el){let v=el.value.replace(/[^\d]/g,'');if(v!==el.value)el.value=v;walkCalcRefresh()}
function walkCleanKm(el){let v=el.value.replace(/[^\d.]/g,'');const p=v.split('.');
  if(p.length>2)v=p[0]+'.'+p.slice(1).join('');if(v!==el.value)el.value=v;walkCalcRefresh()}
function walkStep(d){const el=document.getElementById('walkMin');
  el.value=Math.max(0,(+el.value||+el.placeholder||20)+d);walkCalcRefresh()}
function walkSave(){
  const min=+document.getElementById('walkMin').value;
  if(!min||min<=0||min>600){alert('歩いた時間（分）を入れてください');return}
  const km=document.getElementById('walkKm').value.trim();
  const prev=WALK[todayStr()];
  WALK[todayStr()]={min,t:(prev&&prev.t)||nowHM()};
  if(km&&+km>0)WALK[todayStr()].km=+km;
  saveWALK();
  const st=walkStreak(),kc=walkKcal(min,km&&+km>0?+km:null);
  toast(`🔥 約${kc}kcal 消費${st>1?` 🎉 ${st}日連続`:''}`);
  render();
}
function walkDel(d){if(!confirm(fmtD(d)+' のウォーキングを削除しますか？'))return;
  delete WALK[d];saveWALK();render()}

function wtStep(d){
  const el=document.getElementById('wtin');
  const v=(+el.value||wtSorted().slice(-1)[0]?.w||60)+d;
  el.value=v.toFixed(1);
}
function wtSave(){
  const v=+document.getElementById('wtin').value;
  if(!v||v<=0||v>400){alert('体重を入力してください');return}
  const f=document.getElementById('wtfat').value.trim();
  /* 測った時刻も残す。体重は時間帯で1kg近く動くので、あとから数字を読むのに要る。
     体重の値が変わっていれば測り直しとみなして時刻を更新、体脂肪率だけの追記なら元の時刻を保つ */
  const d=WT_DATE, prev=WT[d], w2=+v.toFixed(1);
  const rec={w:w2};
  if(prev&&prev.t&&+prev.w===w2)rec.t=prev.t;   // 値が同じ＝体脂肪率の追記。元の時刻を保つ
  else if(d===todayStr())rec.t=nowHM();
  /* 過去の日への後書きは、実際に何時に測ったか分からないので時刻は付けない
     （時刻が無い記録は「いつもと違う時間」の判定から外れる作りになっている） */
  if(f)rec.f=+f;
  WT[d]=rec;
  saveWT();render();
}
function wtDel(d){if(!confirm(fmtD(d)+' の記録を削除しますか？'))return;delete WT[d];saveWT();render()}

function wtChart(range){
  const all=wtSorted();
  if(all.length<2)return `<div class="empty" style="padding:34px 10px">2日以上記録するとグラフが出ます</div>`;
  const from=range>=9999?all[0].d:dstr(new Date(Date.now()-range*86400000));
  const pts=all.filter(p=>p.d>=from);
  if(pts.length<2)return `<div class="empty" style="padding:34px 10px">この期間の記録が足りません</div>`;
  const avg=movAvg(pts,7);
  const goal=+CF.goal||0;
  const W=300,H=150,PL=30,PR=6,PT=10,PB=20;
  const x0=dObj(pts[0].d).getTime(),x1=dObj(pts[pts.length-1].d).getTime();
  const span=Math.max(1,x1-x0);
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(goal){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
  const pad=Math.max(0.5,(hi-lo)*0.18);lo-=pad;hi+=pad;
  const X=d=>PL+(dObj(d).getTime()-x0)/span*(W-PL-PR);
  const Y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
  const path=a=>a.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.w).toFixed(1)).join(' ');
  const grid=[hi-pad*0.4,(hi+lo)/2,lo+pad*0.4].map(v=>
    `<line class="gd" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
     <text x="2" y="${(Y(v)+3).toFixed(1)}">${v.toFixed(1)}</text>`).join('');
  const area=`M${X(pts[0].d).toFixed(1)} ${(H-PB).toFixed(1)} `+
    pts.map(p=>'L'+X(p.d).toFixed(1)+' '+Y(p.w).toFixed(1)).join(' ')+
    ` L${X(pts[pts.length-1].d).toFixed(1)} ${(H-PB).toFixed(1)} Z`;
  const lab=d=>{const[,m,dd]=d.split('-');return `${+m}/${+dd}`};
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity=".28"/><stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    ${goal?`<line class="tgt" x1="${PL}" y1="${Y(goal).toFixed(1)}" x2="${W-PR}" y2="${Y(goal).toFixed(1)}"/>`:''}
    <path class="area" d="${area}"/>
    <path class="ln" d="${path(pts)}"/>
    ${pts.length<=45?`<path class="avg" d="${path(avg)}"/>`:''}
    ${pts.map(p=>`<circle class="dot" cx="${X(p.d).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${pts.length>60?1.4:2.4}"/>`).join('')}
    <text x="${PL}" y="${H-5}">${lab(pts[0].d)}</text>
    <text x="${W-PR}" y="${H-5}" text-anchor="end">${lab(pts[pts.length-1].d)}</text>
  </svg>`;
}

/* ================= 食事（カロリーとPFC） =================
   身長・年齢・性別と、体重タブに記録した体重（あれば体脂肪率）から
   基礎代謝 → 1日の消費カロリー → 目標カロリー → PFCの目標量 を出す。
   そこに食べたものを足していく。数字はすべて推定値で、
   「合っているか」より「同じものさしで毎日見られるか」を大事にしています */

const SLOTS=['朝','昼','夜','間食'];
const r1=v=>Math.round(v*10)/10;

/* 活動レベル。TDEE＝基礎代謝×この係数で、トレーニングぶんも込みの数字です */
const ACT_LEVELS=[
  [1.2,  'ほとんど動かない','デスクワーク中心・運動なし'],
  [1.375,'週1〜2回','軽い運動をする日がある'],
  [1.55, '週3〜5回','いちばん多い選択肢です'],
  [1.725,'週6〜7回','ほぼ毎日トレーニング'],
  [1.9,  'とても活発','力仕事＋毎日のトレーニング'],
];
/* 生活のベース（記録から出すとき）。ここにトレーニングは含めず、実際の記録ぶんを別に足す */
const BASE_LEVELS=[[1.2,'デスクワーク中心'],[1.35,'よく歩く・家事が多い'],[1.5,'立ち仕事・力仕事']];
const PLANS=[[-20,'しっかり減量'],[-15,'減量'],[-10,'ゆっくり減量'],[0,'維持'],[10,'増量'],[15,'しっかり増量']];

/* METs＝じっとしている時の何倍エネルギーを使うか。
   消費kcal ≒ METs × 体重kg × 時間h × 1.05 */
const METS_STRENGTH=5.0;
/* 1回のトレーニングとして現実的な上限（分）。終了を押し忘れたときの暴走よけ */
const MAX_SESSION_MIN=240;
const METS_CARDIO={'ランニング':9.8,'ウォーキング':3.5,'エアロバイク':7.0,
  'ローイングマシン':7.0,'クロストレーナー':5.0,'縄跳び':12.3,
  'バドミントン':5.5,    /* ダブルス中心。シングルス主体なら7.0が目安 */
  '登山':6.0};           /* 山道ハイキング。重い荷物や急登はもっと上がるが控えめに見る */
const metsKcal=(mets,kg,min)=>mets*kg*(min/60)*1.05;

/* 体重タブの最新の記録を使う。体重が無いと何も計算できない */
function bodyKg(){const a=wtSorted();return a.length?a[a.length-1].w:null}
function bodyFat(){const a=wtSorted().filter(x=>x.f>0);return a.length?a[a.length-1].f:null}
/* 「計算できる状態か」は bmrInfo() が答えを出せるかどうかそのもの。
   ここで別々の条件を書くと、体脂肪率に極端な値（3%未満など）が入っているのに
   準備OKと判定してしまい、目標の計算が null を返して画面が真っ白になります */
function bodyReady(){return !!bmrInfo()}

/* 基礎代謝（BMR）。体脂肪率がわかっていれば除脂肪体重から（Katch-McArdle）、
   なければ身長・体重・年齢から（Mifflin-St Jeor）。
   筋トレしている人は筋肉が多く、身長からの式だと低めに出やすいので、
   体脂肪率が入っていればそちらを優先します */
function bmrInfo(){
  const kg=bodyKg();if(!kg)return null;
  const f=bodyFat();
  if(f&&f>=3&&f<=60){
    const lbm=kg*(1-f/100);
    return{kcal:Math.round(370+21.6*lbm),how:'体脂肪率から',lbm:r1(lbm)};
  }
  if(!(+CF.height>0)||!(+CF.age>0))return null;
  return{kcal:Math.round(10*kg+6.25*(+CF.height)-5*(+CF.age)+(CF.sex==='f'?-161:5)),how:'身長・体重・年齢から'};
}

/* その日のトレーニングでの消費（推定）。
   有酸素は記録した秒数から、筋トレは「セット数×(動く時間＋インターバル)」で
   だいたいの拘束時間を出す。開始〜終了が記録されていればそちらを優先します */
function workoutBurn(date){
  const out={kcal:0,strMin:0,cardioMin:0};
  const w=WO.find(x=>x.date===date);
  if(!hasBodyW()||!w)return out;
  const kg=bodyWAt(date);
  let strSec=0;
  for(const en of w.entries){
    const ex=exById(en.exerciseId);if(!ex)continue;
    const done=en.sets.filter(s=>s.done);if(!done.length)continue;
    if(ex.part==='有酸素'&&ex.unit==='time'){
      const min=done.reduce((a,s)=>a+(+s.r||0),0);   /* 有酸素のrは「分」で持つ */
      out.cardioMin+=min;
      out.kcal+=metsKcal(METS_CARDIO[ex.name]||6.0,kg,min);
    }else{
      strSec+=done.length*(WORK_SEC+Math.max(30,restFor(ex.part)));
    }
  }
  let strMin=strSec/60;
  if(w.started&&w.finished){
    const real=hm2min(w.finished)-hm2min(w.started);
    /* 終了ボタンは手で押すものなので、押し忘れて何時間も後に押されることがあります。
       現実的な長さのときだけ時計を信じ、それを超えたらセット数からの見積もりに戻します */
    if(real>0&&real<=MAX_SESSION_MIN)strMin=Math.max(0,real-out.cardioMin);
  }
  strMin=Math.min(strMin,MAX_SESSION_MIN);
  out.strMin=Math.round(strMin);
  out.kcal=Math.round(out.kcal+metsKcal(METS_STRENGTH,kg,strMin));
  return out;
}
/* ウォーキングの消費は体重タブと同じ計算（walkKcal）を使う。
   2か所で別々に出すと、同じ日なのに違う数字が並んでしまうため */
function walkBurn(date){
  const x=WALK[date];
  if(!hasBodyW()||!x||!(+x.min>0))return{kcal:0,min:0};
  return{kcal:walkKcal(+x.min,+x.km||null,date),min:+x.min};
}

/* その日の消費カロリー（推定）。
   'act'＝活動レベルの係数から出す（運動ぶん込みなので毎日同じ数字）
   'rec'＝生活のベース＋その日に記録した運動 */
function burnOf(date){
  const b=bmrInfo();if(!b)return null;
  const wo=workoutBurn(date),wk=walkBurn(date);
  if(CF.burnMode==='rec'){
    const base=Math.round(b.kcal*(+CF.base||1.2));
    return{mode:'rec',bmr:b,base,wo,wk,total:base+wo.kcal+wk.kcal};
  }
  return{mode:'act',bmr:b,wo,wk,total:Math.round(b.kcal*(+CF.act||1.55))};
}
/* 記録モードのときの「ふだんの消費」＝直近14日の平均。
   今日を入れると、まだ何もしていない朝に目標が下がってしまうので今日は含めない */
function avgBurn14(){
  const b=bmrInfo();if(!b)return null;
  const base=b.kcal*(+CF.base||1.2);
  let sum=0;
  for(let i=1;i<=14;i++){
    const d=dstr(new Date(dObj(todayStr()).getTime()-i*86400000));
    sum+=base+workoutBurn(d).kcal+walkBurn(d).kcal;
  }
  return Math.round(sum/14);
}
/* 目標を決めるもとになる消費カロリー。
   記録モードでは「直近14日の平均」と「その日の実績」の大きい方を使う。
   こうすると、動いた日は食べられる量が増え、途中で目標が下がることもありません */
function tdee(date){
  const b=bmrInfo();if(!b)return null;
  if(CF.burnMode!=='rec')return Math.round(b.kcal*(+CF.act||1.55));
  const avg=avgBurn14();
  const day=date?burnOf(date).total:0;
  return Math.max(avg,day);
}
function targetKcal(date){const t=tdee(date);return t?Math.round(t*(1+(+CF.plan||0)/100)):null}

/* PFCの目標量。
   タンパク質は体重あたりのg数で決め、脂質はカロリー比で決め、残りを炭水化物にする。
   脂質はホルモンのために下げすぎない（体重×0.6gを下限にする） */
function macroTarget(date){
  const kcal=targetKcal(date),kg=bodyKg();
  if(!kcal||!kg)return null;
  const p=Math.round(kg*(+CF.pgkg||2));
  const fmin=Math.round(kg*0.6);
  const f=Math.max(fmin,Math.round(kcal*((+CF.fpct||25)/100)/9));
  let c=Math.round((kcal-p*4-f*9)/4),tight=false;
  if(c<0){c=0;tight=true}
  return{kcal,p,f,c,tight,fmin};
}

const mealsOf=date=>ML[date]||[];
function dayTotal(date){
  const t={kcal:0,p:0,f:0,c:0};
  for(const m of mealsOf(date)){t.kcal+=+m.kcal||0;t.p+=+m.p||0;t.f+=+m.f||0;t.c+=+m.c||0}
  return{kcal:Math.round(t.kcal),p:Math.round(t.p),f:Math.round(t.f),c:Math.round(t.c)};
}
/* 最近よく食べているもの（直近60日）。内容は最後に記録したものを使う */
function favFoods(n){
  const from=dstr(new Date(Date.now()-60*86400000)),cnt={};
  for(const d of Object.keys(ML)){
    if(d<from)continue;
    for(const m of ML[d]){
      const c=cnt[m.name]||(cnt[m.name]={n:0,d:'',m});
      c.n++;if(d>=c.d){c.d=d;c.m=m}
    }
  }
  return Object.values(cnt).sort((a,b)=>b.n-a.n||(a.d<b.d?1:-1)).slice(0,n);
}
const nowSlot=()=>{const h=new Date().getHours()+new Date().getMinutes()/60;
  return h<10.5?'朝':h<15?'昼':h<21.5?'夜':'間食'};

/* ================= 食事タブ ================= */
let MEAL_DATE=todayStr(), MEAL_SLOT='朝', FOOD_I=-1;
function mealGo(d){
  const nx=dstr(new Date(dObj(MEAL_DATE).getTime()+d*86400000));
  if(nx>todayStr())return;
  MEAL_DATE=nx;render(true);
}
function viewMeal(){
  const date=MEAL_DATE,isToday=date===todayStr();
  let h=`<header><h1>食事</h1><div class="meta">${
    Object.keys(ML).length?Object.keys(ML).length+'日ぶん':'カロリーとPFC'}</div></header>`;

  h+=`<div class="row" style="margin-bottom:11px">
    <button class="howto" onclick="mealGo(-1)">‹ 前の日</button>
    <div class="grow" style="text-align:center;font-weight:600">${isToday?'今日 ':''}${fmtD(date)}</div>
    <button class="howto" onclick="mealGo(1)" style="${isToday?'opacity:.3':''}">次の日 ›</button></div>`;

  /* からだの情報が無いと目標が出せない。何を入れれば何が見えるのかを先に書く */
  if(!bodyReady()){
    h+=`<div class="card" style="text-align:center;padding:24px 18px;border-color:var(--accent)">
      <div style="font-size:32px;line-height:1">🍚</div>
      <b style="display:block;margin:10px 0 6px;font-size:16px">からだの情報を入れてください</b>
      <div class="sub" style="font-size:13px;line-height:1.8;margin-bottom:14px">
        身長・年齢・性別と、体重タブの体重から<br>
        基礎代謝・1日の消費カロリー・PFCの目標量を計算します。</div>
      <button class="btn" onclick="openBody()">からだの情報を入れる</button>
      ${bodyKg()?'':'<div class="sub" style="margin-top:10px;font-size:11.5px">体重タブで今日の体重を記録すると計算できるようになります</div>'}</div>`;
    return h+mealListHTML(date);
  }

  const mt=macroTarget(date),tot=dayTotal(date),burn=burnOf(date);
  const left=mt.kcal-tot.kcal;
  const pct=Math.min(100,Math.round(tot.kcal/mt.kcal*100));
  const over=tot.kcal>mt.kcal;

  h+=`<div class="card" style="text-align:center;padding:17px 13px">
    <div class="sub">${over?'目標より':'あと'}</div>
    <div style="font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;color:${
      over?'var(--warn)':'var(--fg)'}">${Math.abs(left)}<span style="font-size:16px;color:var(--sub)"> kcal</span></div>
    <div class="sub">${over?'多く食べています':'食べられます'}</div>
    <div class="kbar"><div class="bar${over?' over':''}" style="width:${pct}%"></div></div>
    <div class="row sub" style="font-size:11.5px"><span class="grow" style="text-align:left">摂取 ${tot.kcal}</span>
      <span>目標 ${mt.kcal} kcal</span></div>
  </div>`;

  const macRow=(label,now,goal,color)=>{
    const w=goal?Math.min(100,Math.round(now/goal*100)):0;
    const ov=goal&&now>goal*1.1;
    return `<div class="mac"><span style="color:${color};font-weight:700">${label}</span>
      <div class="trk"><div class="bar" style="width:${w}%;background:${ov?'var(--bad)':color}"></div></div>
      <span class="num"><b>${now}</b> / ${goal}g</span></div>`;
  };
  h+=`<div class="card">
    ${macRow('P',tot.p,mt.p,'var(--accent)')}
    ${macRow('F',tot.f,mt.f,'var(--warn)')}
    ${macRow('C',tot.c,mt.c,'var(--ok)')}
    <div class="sub" style="font-size:11.5px;margin-top:2px">
      P＝タンパク質（1g=4kcal）／F＝脂質（1g=9kcal）／C＝炭水化物（1g=4kcal）${
      mt.tight?'<br><span style="color:var(--warn)">目標カロリーに対してPとFが多すぎて、Cの取り分がありません。設定を見直してください。</span>':''}</div>
  </div>`;

  /* 消費カロリー */
  const wkKcal=burn.wk.kcal,woKcal=burn.wo.kcal;
  h+=`<h2 class="sec">${isToday?'今日':'この日'}の消費（推定）</h2>
  <div class="card">
    <div class="row" style="align-items:baseline">
      <div class="grow"><b style="font-size:26px;font-variant-numeric:tabular-nums">${burn.total}</b>
        <span class="sub"> kcal</span></div>
      <button class="howto" onclick="openBody()">設定</button>
    </div>
    <div style="margin-top:9px">`;
  if(burn.mode==='rec'){
    h+=`<div class="row" style="padding:5px 0"><span class="grow sub">生活（基礎代謝 ${burn.bmr.kcal} ×${CF.base}）</span>
        <b style="font-variant-numeric:tabular-nums">${burn.base}</b></div>
      <div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><span class="grow sub">トレーニング${
        burn.wo.strMin||burn.wo.cardioMin?`（${Math.round(burn.wo.strMin+burn.wo.cardioMin)}分）`:''}</span>
        <b style="font-variant-numeric:tabular-nums">${woKcal?'+'+woKcal:'—'}</b></div>
      <div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><span class="grow sub">ウォーキング${
        burn.wk.min?`（${burn.wk.min}分）`:''}</span>
        <b style="font-variant-numeric:tabular-nums">${wkKcal?'+'+wkKcal:'—'}</b></div>
      <div class="sub" style="font-size:11.5px;margin-top:9px">
        記録した運動のぶんだけ、食べられる量も増えます。運動が少ない日は、直近14日の平均（${avgBurn14()}kcal）を下限にしています。</div>`;
  }else{
    h+=`<div class="row" style="padding:5px 0"><span class="grow sub">基礎代謝（${esc(burn.bmr.how)}）</span>
        <b style="font-variant-numeric:tabular-nums">${burn.bmr.kcal}</b></div>
      <div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><span class="grow sub">活動レベル</span>
        <b style="font-variant-numeric:tabular-nums">×${CF.act}</b></div>
      <div class="sub" style="font-size:11.5px;margin-top:9px">
        活動レベルの係数には運動ぶんが含まれているので、毎日同じ数字になります。${
        (woKcal||wkKcal)?`参考までに、${isToday?'今日':'この日'}の記録から計算すると
        トレーニング ${woKcal}kcal・ウォーキング ${wkKcal}kcal です（上の数字に足さないでください）。`:''}
        日ごとの実際の運動から出したいときは、設定で「毎日の記録から」に変えられます。</div>`;
  }
  h+=`</div></div>`;

  h+=mealListHTML(date);

  /* 直近7日 */
  const days=[];
  for(let i=6;i>=0;i--)days.push(dstr(new Date(dObj(date).getTime()-i*86400000)));
  const vals=days.map(d=>dayTotal(d).kcal);
  if(vals.some(v=>v>0)){
    const mx=Math.max(mt.kcal,...vals)*1.05;
    const rec=vals.filter(v=>v>0);
    h+=`<h2 class="sec">直近7日</h2>
    <div class="card">
      <div class="chart" style="position:relative">
        <div style="position:absolute;left:0;right:0;bottom:${mt.kcal/mx*100}%;border-top:1px dashed var(--warn);pointer-events:none"></div>
        ${vals.map(v=>`<div class="b${v?'':' z'}" style="height:${v?Math.max(2,v/mx*100):2}%;${
          v>mt.kcal?'background:linear-gradient(180deg,var(--warn),#a06a10)':''}"></div>`).join('')}
      </div>
      <div class="xlab">${days.map(d=>`<span>${+d.split('-')[2]}</span>`).join('')}</div>
      <div class="sub" style="margin-top:8px;font-size:11.5px">
        記録した${rec.length}日の平均 <b style="color:var(--fg)">${Math.round(rec.reduce((a,b)=>a+b,0)/rec.length)}</b> kcal
        ／ 点線が目標（${mt.kcal}kcal）です。1日ずつの上下より、1週間の平均が目標に近いかを見てください。</div>
    </div>`;
  }
  return h;
}

/* 食事の一覧（時間帯ごと）。目標が未設定でも記録だけはできる */
function mealListHTML(date){
  const items=mealsOf(date),tot=dayTotal(date);
  let h=`<h2 class="sec">食べたもの${items.length?`　合計 ${tot.kcal}kcal`:''}</h2>`;
  const fav=favFoods(6);
  if(fav.length){
    h+=`<div class="card" style="padding:11px">
      <div class="sub" style="font-size:11.5px;margin-bottom:8px">よく食べるもの（タップで${nowSlot()}に追加）</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${fav.map((x,i)=>`<button class="chip" onclick="mealFav(${i})">${esc(x.m.name)}
        <span class="sub">${x.m.kcal}</span></button>`).join('')}</div></div>`;
  }
  for(const slot of SLOTS){
    const list=items.filter(m=>m.slot===slot);
    const sum=list.reduce((a,m)=>a+(+m.kcal||0),0);
    h+=`<div class="card">
      <div class="row" style="margin-bottom:${list.length?'4px':'0'}">
        <b class="grow">${slot}${sum?`<span class="sub" style="font-weight:400"> ${Math.round(sum)}kcal</span>`:''}</b>
        <button class="btn sm ghost nw" onclick="foodSheet('${slot}')">＋ 追加</button></div>`;
    for(const m of list){
      h+=`<div class="meal-i">
        <button class="grow" style="min-width:0;text-align:left" onclick="mealForm('${m.id}')">
          <div class="trunc">${esc(m.name)}</div>
          <div class="sub" style="font-size:11.5px">P${r1(+m.p||0)} F${r1(+m.f||0)} C${r1(+m.c||0)}</div>
        </button>
        <b style="font-variant-numeric:tabular-nums">${Math.round(+m.kcal||0)}</b>
        <button class="del sub" onclick="mealDel('${m.id}')" style="font-size:18px">×</button></div>`;
    }
    h+=`</div>`;
  }
  return h;
}

/* ---- 食品を選ぶ ---- */
function sheetSwap(html){
  const p=document.querySelector('#sheet .panel'),y=p.scrollTop;
  document.getElementById('sheetP').innerHTML=html;
  p.scrollTop=y;
}
function foodSheet(slot){
  MEAL_SLOT=slot||nowSlot();
  Sheet.open(`<h3>${esc(MEAL_SLOT)}に追加</h3>
    <input id="foodq" placeholder="食品を検索…" oninput="foodFilter(this.value)" style="margin-bottom:9px">
    <button class="btn ghost sm" style="width:100%;margin-bottom:11px" onclick="mealForm()">一覧に無いものを手で入力する</button>
    <div id="foodlist">${foodRows()}</div>`);
}
function foodRows(){
  let h='';
  for(const cat of FOOD_CATS){
    const list=FOODS.map((f,i)=>({f,i})).filter(x=>x.f.cat===cat);
    if(!list.length)continue;
    h+=`<div class="fg"><h2 class="sec">${esc(cat)}</h2>`;
    for(const x of list){
      const f=x.f;
      h+=`<button class="pickitem fd" data-n="${esc(f.n)}" style="width:100%;text-align:left" onclick="foodAmt(${x.i})">
        <div class="grow" style="min-width:0"><div class="trunc">${esc(f.n)}</div>
          <div class="sub" style="font-size:11.5px">${f.u==='g'?`100gあたり ${f.k}kcal`:`${esc(f.s)} ${f.k}kcal`}
            ・P${f.p} F${f.f} C${f.c}</div></div>
        <span class="sub" style="font-size:15px">›</span></button>`;
    }
    h+=`</div>`;
  }
  return h;
}
function foodFilter(q){
  q=q.trim();
  document.querySelectorAll('#foodlist .fd').forEach(el=>{el.style.display=!q||el.dataset.n.includes(q)?'':'none'});
  document.querySelectorAll('#foodlist .fg').forEach(g=>{
    g.style.display=[...g.querySelectorAll('.fd')].some(i=>i.style.display!=='none')?'':'none'});
}
function foodAmt(i){
  FOOD_I=i;const f=FOODS[i];
  sheetSwap(`<h3>${esc(f.n)}</h3>
    <div class="sub" style="margin-bottom:10px">${f.u==='g'?'食べた量（g）を入れてください':esc(f.s)+' を何個ぶん食べましたか'}</div>
    <div class="step">
      <button onclick="foodStep(-1)">−</button>
      <input id="foodAmt" type="text" inputmode="decimal" value="${f.d}" oninput="foodPrev()">
      <button onclick="foodStep(1)">＋</button>
    </div>
    <div class="sub" style="text-align:center;margin-top:5px">${f.u==='g'?'g':'個ぶん'}</div>
    <div class="card" id="foodPv" style="margin-top:12px;text-align:center"></div>
    <div class="row" style="gap:9px">
      <button class="btn ghost" style="flex:1" onclick="foodSheet(MEAL_SLOT)">‹ 一覧へ</button>
      <button class="btn" style="flex:2" onclick="foodAdd()">${esc(MEAL_SLOT)}に追加</button></div>`);
  foodPrev();   // 入力欄ができてから計算する
}
const foodQty=()=>{const el=document.getElementById('foodAmt');
  const v=parseFloat(String(el?el.value:'').replace(/[^\d.]/g,''));return v>0?v:0};
function foodStep(d){
  const f=FOODS[FOOD_I],el=document.getElementById('foodAmt');
  const step=f.u==='g'?10:(f.d>=3?1:0.5);
  el.value=r1(Math.max(0,foodQty()+d*step));
  foodPrev();
}
function foodCalc(){
  const f=FOODS[FOOD_I],q=foodQty(),k=f.u==='g'?q/100:q;
  const name=f.u==='g'?`${f.n} ${r1(q)}g`:(q===1?f.n:`${f.n} ×${r1(q)}`);
  return{name,kcal:Math.round(f.k*k),p:r1(f.p*k),f:r1(f.f*k),c:r1(f.c*k)};
}
function foodPvHTML(){
  const v=foodCalc();
  return `<div style="font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2">${v.kcal}
    <span class="sub" style="font-size:14px">kcal</span></div>
    <div class="sub">P ${v.p}g ／ F ${v.f}g ／ C ${v.c}g</div>`;
}
function foodPrev(){const el=document.getElementById('foodPv');if(el)el.innerHTML=foodPvHTML()}
function foodAdd(){
  if(!foodQty()){toast('量を入れてください');return}
  mealPush(foodCalc());
}
function mealPush(o){
  (ML[MEAL_DATE]=ML[MEAL_DATE]||[]).push({id:uid(),name:o.name,slot:MEAL_SLOT,
    kcal:o.kcal,p:o.p,f:o.f,c:o.c,t:nowHM()});
  saveML();Sheet.close();render();
  toast(`${esc(o.name)} を記録しました（${o.kcal}kcal）`);
}
/* よく食べるものチップ。前に記録した内容をそのまま今の時間帯に足す */
function mealFav(i){
  const x=favFoods(6)[i];if(!x)return;
  MEAL_SLOT=nowSlot();
  mealPush({name:x.m.name,kcal:+x.m.kcal||0,p:+x.m.p||0,f:+x.m.f||0,c:+x.m.c||0});
}

/* ---- 手で入力・修正 ---- */
function mealForm(id){
  const m=id?mealsOf(MEAL_DATE).find(x=>x.id===id):null;
  if(m)MEAL_SLOT=m.slot;
  const row=(lab,fid,v,unit)=>`<div class="row" style="margin-bottom:8px"><span style="width:82px" class="sub">${lab}</span>
    <input id="${fid}" class="grow" type="text" inputmode="decimal" value="${v}" placeholder="0" style="text-align:center">
    <span class="sub" style="width:30px">${unit}</span></div>`;
  Sheet.open(`<h3>${m?'記録を直す':'手で入力'}</h3>
    <div class="seg" style="margin-bottom:11px">${SLOTS.map(s=>
      `<button class="${s===MEAL_SLOT?'on':''}" onclick="mealSlotSel('${s}')">${s}</button>`).join('')}</div>
    <input id="mfN" placeholder="食べたもの（例: コンビニの唐揚げ）" value="${m?esc(m.name):''}" style="margin-bottom:10px">
    ${row('カロリー','mfK',m?Math.round(m.kcal):'','kcal')}
    ${row('P タンパク質','mfP',m?r1(+m.p||0):'','g')}
    ${row('F 脂質','mfF',m?r1(+m.f||0):'','g')}
    ${row('C 炭水化物','mfC',m?r1(+m.c||0):'','g')}
    <div class="sub" style="font-size:11.5px;margin:2px 0 12px">
      カロリーを空けておくと、PFCから計算します（P4・F9・C4kcal/g）。パッケージの「栄養成分表示」の数字をそのまま入れてください。</div>
    <button class="btn" onclick="mealSave('${m?m.id:''}')">${m?'保存する':'追加する'}</button>
    ${m?`<button class="btn danger" style="margin-top:9px" onclick="mealDel('${m.id}')">この記録を削除</button>`:''}`);
}
function mealSlotSel(s){
  MEAL_SLOT=s;
  document.querySelectorAll('#sheetP .seg button').forEach(b=>b.classList.toggle('on',b.textContent.trim()===s));
}
function mealSave(id){
  const num=i=>{const v=parseFloat(String(document.getElementById(i).value).replace(/[^\d.]/g,''));return v>0?v:0};
  const name=document.getElementById('mfN').value.trim();
  if(!name){toast('食べたものの名前を入れてください');return}
  const p=num('mfP'),f=num('mfF'),c=num('mfC');
  let kcal=num('mfK');
  if(!kcal)kcal=Math.round(p*4+f*9+c*4);
  if(!kcal&&!p&&!f&&!c){toast('カロリーかPFCのどれかを入れてください');return}
  const list=ML[MEAL_DATE]=ML[MEAL_DATE]||[];
  const m=id?list.find(x=>x.id===id):null;
  if(m){Object.assign(m,{name,slot:MEAL_SLOT,kcal:Math.round(kcal),p:r1(p),f:r1(f),c:r1(c)})}
  else list.push({id:uid(),name,slot:MEAL_SLOT,kcal:Math.round(kcal),p:r1(p),f:r1(f),c:r1(c),t:nowHM()});
  saveML();Sheet.close();render();
  toast(m?'記録を直しました':`${esc(name)} を記録しました（${Math.round(kcal)}kcal）`);
}
function mealDel(id){
  const list=mealsOf(MEAL_DATE),m=list.find(x=>x.id===id);
  if(!m)return;
  if(!confirm(`「${m.name}」を削除しますか？`))return;
  ML[MEAL_DATE]=list.filter(x=>x.id!==id);
  if(!ML[MEAL_DATE].length)delete ML[MEAL_DATE];
  saveML();Sheet.close();render();
}

function bodyNum(k,el){

  CF[k]=v;saveCF();render();
  /* 入れた数字を計算結果に反映する。ただし入力の確定は「次の入力欄を触ったとき」にも起きるので、
     すぐ差し替えるとその欄が消えてしまいます。どの入力欄にも居ないときだけ出し直します */

    if(document.getElementById('sheetP'))sheetSwap(bodyHTML());

}

/* ================= 履歴 ================= */
function viewHist(){
  cleanup();
  const done=WO.filter(w=>w.entries.length);
  let h=`<header><h1>履歴</h1><div class="meta">${done.length}回</div></header>`;
  /* 記録ゼロのときにグラフだけ並べても意味が読めないので、何が見えるようになるかを書く */
  if(!done.length){
    return h+`<div class="card" style="text-align:center;padding:26px 18px">
        <div style="font-size:34px;line-height:1">📊</div>
        <b style="display:block;margin:10px 0 6px;font-size:16px">記録がたまるとここに出ます</b>
        <div class="sub" style="font-size:13px;line-height:1.7">
          まずは記録タブで1回ぶん記録してみてください。<br>1週間も続ければグラフが読めるようになります。</div>
      </div>
      <h2 class="sec">ここで見られるようになるもの</h2>
      <div class="card">
        <div class="term"><b>部位別の週間セット数</b><span>今週どの部位を何セットやったか。目安の10〜20セット／週に届いているかが一目でわかります</span></div>
        <div class="term"><b>週別ボリューム</b><span>重量×回数×セット数の合計。棒が伸びていれば成長しています</span></div>
        <div class="term"><b>連続記録日・今月の回数</b><span>続けている実感がほしいとき用</span></div>
        <div class="term"><b>過去の記録</b><span>日付をタップすると、その日の内容を見たり直したりできます</span></div>
      </div>
      <div style="margin-top:14px"><button class="btn" onclick="go('log')">記録をはじめる</button></div>`;
  }
  const weeks=[];const base=new Date();base.setHours(0,0,0,0);base.setDate(base.getDate()-base.getDay());
  for(let i=7;i>=0;i--){
    const s=new Date(base);s.setDate(s.getDate()-i*7);
    const e=new Date(s);e.setDate(e.getDate()+7);
    const ss=dstr(s),es=dstr(e);let v=0;
    for(const w of done)if(w.date>=ss&&w.date<es)v+=volume(w);
    weeks.push({label:`${s.getMonth()+1}/${s.getDate()}`,v});
  }
  const mx=Math.max(1,...weeks.map(w=>w.v));
  h+=`<div class="card">
    <div class="row" style="margin-bottom:4px"><span class="sub">週別ボリューム</span>
      <span class="sub" style="margin-left:auto">最大 ${mx.toLocaleString()}</span></div>
    <div class="chart">${weeks.map(w=>`<div class="b${w.v?'':' z'}" style="height:${w.v?Math.max(3,w.v/mx*100):2}%"></div>`).join('')}</div>
    <div class="xlab">${weeks.map(w=>`<span>${w.label}</span>`).join('')}</div></div>`;

  // 部位別 週間セット数（目安は週10〜20セット）
  const wkNow=weekSets(0),wkPrev=weekSets(1);
  const counts=PARTS.filter(p=>p!=='有酸素');
  const scale=Math.max(24,...counts.map(p=>wkNow.m[p]));
  h+=`<div class="card">
    <div class="row" style="margin-bottom:9px"><span class="sub">部位別の週間セット数</span>
      <span class="sub" style="margin-left:auto">${fmtD(wkNow.from)}の週</span></div>`;
  for(const p of counts){
    const v=wkNow.m[p],pv=wkPrev.m[p];
    const cls=v<10?'lo':v>20?'hi':'';
    h+=`<div class="wk">
      <span style="font-size:13px">${esc(p)}</span>
      <div class="trk">
        <div class="band" style="left:${10/scale*100}%;width:${10/scale*100}%"></div>
        <div class="bar ${cls}" style="width:${Math.min(100,v/scale*100)}%"></div>
      </div>
      <span class="num">${v}<span class="sub" style="font-size:10px">${pv?` (${pv})`:''}</span></span>
    </div>`;
  }
  h+=`<div class="sub" style="font-size:11.5px;border-top:1px solid var(--line);padding-top:8px">
    緑の帯が目安の10〜20セット／週。（ ）内は先週の数字です。</div></div>`;

  const streak=(()=>{let n=0;const d=new Date();
    for(let i=0;i<400;i++){const s=new Date(d);s.setDate(s.getDate()-i);
      if(done.some(w=>w.date===dstr(s)))n++;else if(i>0)break}return n})();
  const thisMonth=done.filter(w=>w.date.slice(0,7)===todayStr().slice(0,7)).length;
  h+=`<div class="row" style="gap:11px;margin-bottom:11px">
    <div class="card grow" style="margin:0;text-align:center"><div class="sub" style="font-size:11.5px">今月</div><b style="font-size:20px">${thisMonth}<span class="sub" style="font-size:12px">回</span></b></div>
    <div class="card grow" style="margin:0;text-align:center"><div class="sub" style="font-size:11.5px">連続記録日</div><b style="font-size:20px">${streak}<span class="sub" style="font-size:12px">日</span></b></div>
    <div class="card grow" style="margin:0;text-align:center"><div class="sub" style="font-size:11.5px">総回数</div><b style="font-size:20px">${done.length}</b></div></div>`;

  if(!done.length)return h+`<div class="empty">記録がまだありません</div>`;
  h+=`<h2 class="sec">記録一覧</h2><div class="card">`;
  for(const w of done.slice(0,60)){
    const names=w.entries.map(e=>(exById(e.exerciseId)||{}).name).filter(Boolean).join('・');
    h+=`<div class="hist" onclick="openDay('${w.date}')">
      <div class="d">${fmtD(w.date)}</div>
      <div class="grow"><div class="trunc" style="font-size:13.5px">${esc(names||'—')}</div>
        <div class="sub" style="font-size:11.5px">${w.entries.length}種目 / ${volume(w).toLocaleString()}${CF.unit}</div></div>
      <div class="sub">›</div></div>`;
  }
  return h+`</div>`;
}

  EX.push({id:uid(),name:n,part:document.getElementById('np').value,unit:document.getElementById('nu').value});
  saveEX();Sheet.close();render();

function delEx(id){
  const used=WO.some(w=>w.entries.some(e=>e.exerciseId===id));
  if(!confirm(used?'この種目は記録に使われています。削除すると履歴の表示から消えます。よろしいですか？':'削除しますか？'))return;
  EX=EX.filter(e=>e.id!==id);saveEX();render();

/* 設定タブは項目が多いので折りたたみ式。開いた項目は覚えておく（タブを離れても同セッション中は維持） */
let SET_OPEN={};
function foldSec(id,title,summary,inner){
  const open=!!SET_OPEN[id];
  return `<div class="card" style="padding:0;overflow:hidden">
    <button class="row" style="width:100%;padding:13px;text-align:left"
      onclick="SET_OPEN['${id}']=${open?'false':'true'};render()">
      <span class="grow" style="min-width:0"><b style="font-size:14.5px">${title}</b>
        ${!open&&summary?`<span class="sub" style="margin-left:7px;font-size:12px">${summary}</span>`:''}</span>
      <span class="sub" style="font-size:15px;transform:rotate(${open?'90deg':'0'});transition:.15s">›</span></button>
    ${open?`<div style="padding:2px 13px 13px">${inner}</div>`:''}
  </div>`;
}

        （P${m.p} / F${m.f} / C${m.c}g）です。`)(macroTarget(todayStr()))

  h+=foldSec('push','毎朝の通知','7:00',`
    <div id="pushStat" class="sub" style="margin-bottom:10px;font-size:12.5px">確認中…</div>

    </div>`);

  h+=foldSec('data','バックアップ','',`
    <button class="btn ghost" onclick="exportJSON()" style="margin-bottom:9px">バックアップを書き出す</button>

    <button class="btn danger" style="margin-top:4px" onclick="wipe()">全データを削除</button>`);

  /* アプリの更新だけは畳まない。いちばん使う項目で、新バージョンの知らせも見逃してほしくないため */
  h+=`<h2 class="sec">アプリの更新</h2>
  <div class="card">
    <button class="btn ghost" id="updBtn" onclick="updateApp()">最新版に更新</button>
    <div class="sub" id="updMsg" style="margin-top:9px;font-size:11.5px">
      ${UPDATE_READY?'<span style="color:var(--ok)">新しいバージョンがあります。タップして更新してください。</span>'

function setRest(part,sec){
  if(!CF.restBy)CF.restBy=Object.assign({},REST_DEFAULT);
  CF.restBy[part]=sec;saveCF();render();
}
function resetRest(){
  CF.restBy=null;saveCF();render();
  toast('おすすめの秒数に戻しました');
}
function applyPreset(k){
  if(!PRESETS[k])return;
  CF.routine=PRESETS[k].slice();saveCF();render();
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({v:3,exercises:EX,workouts:WO,weights:WT,walks:WALK,meals:ML,config:CF},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kasane-${todayStr()}.json`;a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d.workouts||!d.exercises)throw 0;
    if(!confirm('現在のデータを上書きします。よろしいですか？'))return;
    EX=d.exercises;WO=d.workouts;WT=d.weights||{};WALK=d.walks||{};ML=d.meals||{};CF=Object.assign(CF,d.config||{});
    /* 古いバックアップだと、その後に増えたプリセット種目が入っていない。
       seedVersion は上書きされないので起動時の自動追加も走らない＝消えたままになる。
       ここで不足分を足しておく（既存の種目・記録には触れない） */
    const have=new Set(EX.map(e=>e.name));
    EX=EX.concat(SEED.filter(s=>!have.has(s[0])).map(mkEx));
    saveEX();saveWO();saveWT();saveWALK();saveML();saveCF();render();alert('読み込みました');
  }catch(e){alert('ファイルを読めませんでした')}};
  r.readAsText(f);inp.value='';
}
function wipe(){
  if(!confirm('すべての記録（トレーニング・体重・ウォーキング・食事）を削除します。元に戻せません。'))return;
  if(!confirm('本当によろしいですか？'))return;
  localStorage.removeItem(K.wo);localStorage.removeItem(K.wt);localStorage.removeItem(K.wk);
  localStorage.removeItem(K.ml);
  WO=[];WT={};WALK={};ML={};render();
}

/* ================= 初回セットアップ =================
   このアプリの挙動は「曜日ごとの部位」と「1回の時間」で決まるが、
   初めての人はその存在を知らないまま「今日は背中・肩の日」と決められてしまう。
   最初に2つだけ聞いて、自分の設定にしてもらう。 */
const SETUP={step:0,freq:3,style:'ppl',dur:60};
/* 週の回数 × 分け方 → 使うプリセット */
const SETUP_PRESET={
  '2:ppl':'週2回（上半身/下半身）', '2:part':'週2回（上半身/下半身）', '2:ul':'おまかせ 週2回（上下2分割）',
  '3:ppl':'PPL 週3回',             '3:part':'週3回（王道の3分割）',   '3:ul':'おまかせ 週3回（上下＋全身）',
  '4:ppl':'PPL 週4回＋有酸素',      '4:part':'週4回＋有酸素',          '4:ul':'おまかせ 週4回（上下2分割）',
  '6:ppl':'PPL 週6回（本格）',      '6:part':'週5回（部位別）',        '6:ul':'おまかせ 週6回（上下2分割）',
  /* 週末だけ。PPLは3日必要なので金曜から、部位分けなら土日に全身2回、おまかせは上半身/下半身 */
  'we:ppl':'週末だけ（金土日）',    'we:part':'週末だけ（土日）',      'we:ul':'おまかせ 週末（上下2分割）'
};
function startSetup(){SETUP.step=0;document.getElementById('welcome').classList.add('on');drawSetup()}
function setupGo(n){SETUP.step=n;drawSetup()}
function setupPick(k,v){SETUP[k]=v;drawSetup()}
function finishSetup(apply){
  if(apply){
    const key=SETUP.freq+':'+SETUP.style;
    const preset=SETUP_PRESET[key];
    if(preset&&PRESETS[preset])CF.routine=PRESETS[preset].slice();
    CF.duration=SETUP.dur;
  }
  CF.setupDone=true;saveCF();
  document.getElementById('welcome').classList.remove('on');
  TAB='log';VIEW_DATE=todayStr();render();
}
function drawSetup(){
  const s=SETUP,el=document.getElementById('welcomeIn');

    `<button class="opt ${on?'on':''}" onclick="${onclick}"><b>${title}</b><span>${desc}</span></button>`;

  if(s.step===0){
    h=`<div class="body">
      <div style="text-align:center;margin:24px 0 30px">

      </div>
      <ul class="tips" style="padding-left:20px">
        <li><b>今日どこを鍛えるか</b>を毎日教えてくれます</li>

        <li>記録はこの端末の中だけ。アカウント登録は要りません</li>
      </ul>

    </div>
    <div class="wfoot">
      <button class="btn" onclick="setupGo(1)">はじめる</button>
      <button class="skip" onclick="finishSetup(false)">スキップ</button>

  }else if(s.step===1){
    h=`${dots(1)}<div class="body">
      <h2>週に何回、ジムに行けそうですか？</h2>

      ${opt(s.freq==='we','週末だけ','平日は行けない人向け。土日（または金土日）にまとめます',"setupPick('freq','we')")}
      ${opt(s.freq===2,'週2回','忙しい人向け。1回で上半身／下半身をまとめます',"setupPick('freq',2)")}
      ${opt(s.freq===3,'週3回','いちばん続けやすい定番。休養日をしっかり取れます',"setupPick('freq',3)")}
      ${opt(s.freq===4,'週4回','有酸素の日を1日入れた組み方',"setupPick('freq',4)")}
      ${opt(s.freq===6,'週5〜6回','部位を細かく分けて追い込みたい人向け',"setupPick('freq',6)")}
    </div>
    <div class="wfoot"><button class="btn" onclick="setupGo(2)">次へ</button>
      <button class="skip" onclick="setupGo(0)">戻る</button></div>`;
  }else if(s.step===2){
    const cmp=s.freq==='we'
      ?'<div class="lead">週末だけなら、迷ったら<b>「おまかせ」</b>でOK。考えずに出てきたメニューをやるだけです</div>'
      :'<div class="lead">迷ったら一番上の<b>「おまかせ」</b>で大丈夫です</div>';
    h=`${dots(2)}<div class="body">
      <h2>体の分け方を選んでください</h2>
      ${cmp}
      ${opt(s.style==='ul','おまかせ（上半身／下半身）','考えなくてOK。上半身の日と下半身の日に分けて、2日で全身を1周します。出てきたメニューをやるだけ',"setupPick('style','ul')")}
      ${opt(s.style==='ppl','動作で分ける（PPL）','押す日・引く日・脚の日の3種類。同じ筋肉を続けて使わないので回復させやすい',"setupPick('style','ppl')")}
      ${opt(s.style==='part','部位で分ける','胸の日・背中の日…と部位ごとに分ける昔ながらの方法。狙った部位を集中的にやれます',"setupPick('style','part')")}
      <div class="card" style="margin-top:14px">
        <div class="sub" style="font-size:12px;margin-bottom:6px">この設定だとこうなります</div>

    </div>
    <div class="wfoot"><button class="btn" onclick="setupGo(3)">次へ</button>
      <button class="skip" onclick="setupGo(1)">戻る</button></div>`;
  }else{
    h=`${dots(3)}<div class="body">

         [60,'1時間','いちばん標準的。メニューをひと通りこなせます'],
         [90,'1.5時間','じっくり追い込みたい日に'],
         [120,'2時間','時間をたっぷり使える人に']]
        .map(([v,t,d])=>opt(s.dur===v,t,d,`setupPick('dur',${v})`)).join('')}
    </div>
    <div class="wfoot"><button class="btn" onclick="finishSetup(true)">この設定ではじめる</button>
      <button class="skip" onclick="setupGo(2)">戻る</button></div>`;
  }
  el.innerHTML=h;
  el.parentElement.scrollTop=0;
  if(s.step===2){
    const preset=SETUP_PRESET[s.freq+':'+s.style],r=PRESETS[preset]||[];
    document.getElementById('setupPrev').innerHTML=
      r.map((v,i)=>`<span style="color:${v==='休み'?'var(--sub)':'var(--fg)'}">${'日月火水木金土'[i]} ${esc(partDisp(v))}</span>`).join('　');
  }
}

  Sheet.open(h);

/* その日のウォームアップ／ストレッチ一覧をつくる */
function wuPlan(date){
  const parts=partsOf(date);
  if(!parts.length)return {rest:true,cool:REST_STRETCH.map((t,i)=>({id:'r'+i,t}))};
  /* グループ名に直接の項目が無ければ（全身など）、中身の部位から集める。
     多すぎると結局やらないので、それぞれ5つまでに絞る */
  const dyn=[...new Set(parts.flatMap(p=>
    WARMUP_GUIDE[p]||expandParts([p]).flatMap(q=>WARMUP_GUIDE[q]||[])))].slice(0,5);
  const cool=[...new Set(expandParts(parts).flatMap(p=>COOLDOWN[p]||[]))].slice(0,5);
  const warm=[{id:'w0',t:'体を温める 3〜5分',d:'バイク・早歩き・その場足踏みなど。うっすら汗ばむまで'}]
    .concat(dyn.map((t,i)=>({id:'w'+(i+1),t,d:''})))
    .concat([{id:'wz',t:'1種目めを軽い重量で1〜3セット',d:'本番60kgならバーのみ→40kg→50kg。この分は記録しません'}]);
  return {rest:false,warm,cool:cool.map((t,i)=>({id:'c'+i,t}))};
}
function wuToggle(id){
  const w=getWorkout(VIEW_DATE,true);
  w.wuDone=w.wuDone||[];
  const i=w.wuDone.indexOf(id);
  if(i<0)w.wuDone.push(id);else w.wuDone.splice(i,1);
  saveWO();render();
}
function wuFold(){
  const w=getWorkout(VIEW_DATE,true);
  w.wuOpen=!(w.wuOpen===undefined?defaultWuOpen(w):w.wuOpen);
  saveWO();render();
}
/* トレーニング前は開いて、記録が始まったら畳む */
const defaultWuOpen=w=>!(w&&w.entries&&w.entries.some(en=>en.sets.some(s=>s.done)));

function wuCard(date){
  const w=getWorkout(date),plan=wuPlan(date);
  const done=(w&&w.wuDone)||[];
  const open=w&&w.wuOpen!==undefined?w.wuOpen:defaultWuOpen(w);
  const all=(plan.warm||[]).concat(plan.cool||[]);
  const n=all.filter(x=>done.includes(x.id)).length;
  const item=(x,sub)=>{
    const on=done.includes(x.id);
    const hasGuide=!!moveGuide(x.t);
    return `<div class="wu-i${on?' on':''}">
      <div class="grow" style="display:flex;align-items:flex-start;gap:10px" onclick="wuToggle('${x.id}')">
        <div class="wu-c">${on?'✓':''}</div>
        <div class="grow"><div>${esc(x.t)}</div>${x.d?`<div class="sub" style="font-size:11.5px">${esc(x.d)}</div>`:''}</div>
      </div>
      ${hasGuide?`<button class="howto" style="flex:none" onclick="showMove('${esc(x.t).replace(/'/g,"\\'")}')">やり方</button>`:''}
    </div>`;
  };
  let h=`<div class="card">
    <div class="row" onclick="wuFold()" style="cursor:pointer">
      <b class="grow">${plan.rest?'今日のストレッチ':'ウォームアップとストレッチ'}</b>
      <span class="tag${n===all.length?' a':''}">${n}/${all.length}</span>
      <span class="sub" style="font-size:15px">${open?'⌃':'⌄'}</span>
    </div>`;
  if(!open)return h+`</div>`;
  if(plan.rest){
    h+=`<div class="sub" style="margin:6px 0 4px;font-size:12.5px">休養日こそ体を整える日。筋肉は休んでいる間に育ちます。</div>`;
    h+=plan.cool.map(x=>item(x)).join('');
  }else{
    h+=`<div class="wu-h">トレーニング前（${WARMUP_MIN}分）</div>`;
    h+=plan.warm.map(x=>item(x)).join('');
    if(plan.cool.length){
      h+=`<div class="wu-h">トレーニング後（5分）</div>
        <div class="sub" style="font-size:11.5px;margin-bottom:4px">止めて伸ばすストレッチは前ではなく<b style="color:var(--fg)">後</b>に。前にやると力が出にくくなります。</div>`;
      h+=plan.cool.map(x=>item(x)).join('');
    }
  }
  return h+`</div>`;
}

      <div class="term"><b>食事</b><span>目標カロリーとPFC、食べたものの記録、その日の消費カロリー。まず「からだの情報」を入れてください</span></div>
      <div class="term"><b>履歴</b><span>週にどの部位を何セットやったか。緑の帯（10〜20セット）に入っていれば十分です</span></div>
      <div class="term"><b>種目</b><span>57種目の一覧。タップすると、その種目だけの記録と伸びが見られます</span></div>
      <div class="term"><b>設定</b><span>曜日ごとの部位、時間、インターバル、バックアップ</span></div>
    </div>
    <div style="margin-top:14px"><button class="btn ghost" onclick="Sheet.close();startSetup()">初期設定をやり直す</button></div>`;
  Sheet.open(h);
}

/* ================= 更新 =================
   ホーム画面から開くとSafariの再読み込みボタンが無いので、設定タブから明示的に更新できるようにする。
   キャッシュを消して読み直すだけなので、localStorageの記録には触れません */
const APP_V='v3.20';
let UPDATE_READY=false;

async function updateApp(){
  const btn=document.getElementById('updBtn'), msg=document.getElementById('updMsg');
  if(btn){btn.disabled=true;btn.textContent='更新中…'}
  if(msg)msg.textContent='キャッシュを削除しています…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){/* 消せなくても、下の再読み込みで直ることが多い */}
  /* URLに時刻を付けて、確実にサーバーから取り直す */
  const u=new URL(location.href);
  u.searchParams.set('v',Date.now());
  location.replace(u.toString());
}

/* 新しいバージョンが来ていたら設定タブで知らせる */
function watchForUpdate(reg){
  if(!reg)return;
  if(reg.waiting)markUpdateReady();
  reg.addEventListener('updatefound',()=>{
    const sw=reg.installing;
    if(!sw)return;
    sw.addEventListener('statechange',()=>{
      /* 既にコントローラーが居る＝初回インストールではなく更新 */
      if(sw.state==='installed'&&navigator.serviceWorker.controller)markUpdateReady();
    });
  });
}
function markUpdateReady(){
  if(UPDATE_READY)return;
  UPDATE_READY=true;
  /* 「アプリの更新」は畳まないので、設定タブを見ていれば #updMsg がそのまま見えます。
     他のタブに居るときだけトーストで知らせます */
  const msg=document.getElementById('updMsg');
  if(msg)msg.innerHTML='<span style="color:var(--ok)">新しいバージョンがあります。タップして更新してください。</span>';
  else toast('新しいバージョンがあります（設定タブ）');
}

/* ============ 毎朝の通知（Web Push） ============
   iMac側のサーバー(tools/server.py)に購読を登録すると、
   毎朝7時に send_push.py が通知を送ってくる。
   iOSは「ホーム画面に追加したPWA」でのみ通知が使える（iOS16.4以降）。 */
const VAPID_PUB='BFZ0oBxrGt69_3kOpo092dzXg4wbdHfjSDTNfqLeQOYeav1yBIExSgScxfGGIVUG_HoyB9KTMhqUf27jEJJODVA';
const b64ToU8=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(b,c=>c.charCodeAt(0))};

function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}

async function pushSub(){
  if(!pushSupported())return null;
  try{const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription()}
  catch(e){return null}
}
async function pushRefresh(){
  const st=document.getElementById('pushStat'),btn=document.getElementById('pushBtn');
  if(!st)return;
  if(!pushSupported()){
    st.innerHTML='この開き方では通知が使えません。<b>ホーム画面に追加したKasane</b>から開いてください（iOS16.4以降）。';
    if(btn)btn.style.display='none';return;
  }
  const sub=await pushSub();
  if(sub){st.innerHTML='<span style="color:var(--ok)">✓ オンになっています。</span>毎朝7時に届きます';
    btn.textContent='通知をオフにする'}
  else if(Notification.permission==='denied'){
    st.innerHTML='通知がブロックされています。iPhoneの<b>設定 → 通知 → Kasane</b>で許可してください';
    btn.textContent='通知をオンにする'}
  else{st.textContent='オフになっています';btn.textContent='通知をオンにする'}
}
async function pushToggle(){
  if(!pushSupported())return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const cur=await reg.pushManager.getSubscription();
    if(cur){
      await fetch('unsubscribe',{method:'POST',body:JSON.stringify({endpoint:cur.endpoint})}).catch(()=>{});
      await cur.unsubscribe();
      toast('通知をオフにしました');
    }else{
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){pushRefresh();return}
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)});
      const r=await fetch('subscribe',{method:'POST',body:JSON.stringify(sub.toJSON())});
      if(!r.ok)throw new Error('server');
      toast('毎朝7時に通知が届きます');
    }
  }catch(e){
    /* github.io版にはサーバーが無いのでここに来る */
    alert('登録できませんでした。Tailscale版（imac.tail…）のKasaneで試してください。');
  }
  pushRefresh();
}
async function pushTest(){
  try{
    const r=await fetch('push-test',{method:'POST'});
    const d=await r.json();
    toast(d.ok?'送りました。数秒でこの端末に届きます':'送れませんでした: '+(d.detail||''));
  }catch(e){alert('サーバーに届きませんでした。Tailscale版で試してください。')}
}

/* ============ 自動バックアップ ============
   記録はこの端末のブラウザの中にしか無い。機種変更やブラウザのデータ削除で消えてしまうので、
   自宅サーバー版で開いたときだけ、その時点の全データをiMacへ送って backups/ に残しておく。
   中身は「バックアップを書き出す」と同じ形なので、そのまま読み込みに使える。
   公開版(github.io)は保存先のサーバーが無いので何もしない。
   失敗しても黙って諦める（圏外・iMacが寝ている等。普段の操作を邪魔しないため） */
const BK_LAST='kintore.lastBackup';
function autoBackup(closing){
  if(location.hostname.endsWith('github.io'))return;
  /* localhostはiMac上での開発・動作確認。ここから送るとテスト用の空データが
     iPhoneのバックアップを同日上書きしてしまう（2026-08-08に実際に起きた） */
  if(['localhost','127.0.0.1'].includes(location.hostname))return;
  if(Date.now()-(+localStorage.getItem(BK_LAST)||0)<30000)return;  /* アプリ切替の連打を抑える */
  /* origin＝どの端末・アドレスから来たか。後で「これは本当にiPhoneのか？」を確かめられるように */
  const body=JSON.stringify({v:3,exercises:EX,workouts:WO,weights:WT,walks:WALK,meals:ML,config:CF,
                             origin:location.hostname,app:APP_V});
  const done=()=>localStorage.setItem(BK_LAST,Date.now());
  /* 閉じる瞬間は fetch が途中で打ち切られるので sendBeacon（送りっぱなし）を使う */
  if(closing&&navigator.sendBeacon){
    if(navigator.sendBeacon('backup',new Blob([body],{type:'application/json'})))done();
    return;
  }
  fetch('backup',{method:'POST',headers:{'Content-Type':'application/json'},body})
    .then(r=>{if(r.ok)done()}).catch(()=>{});
}
/* 設定タブに「ちゃんと効いているか」を出す。動いていないと気づけないため */
function autoBackupStatus(){
  if(location.hostname.endsWith('github.io'))
    return '<span style="color:var(--sub)">この公開版では自動バックアップは動きません（自宅サーバー版で開くと自動保存されます）。</span>';
  const t=+localStorage.getItem(BK_LAST)||0;
  if(!t)return '<span style="color:var(--sub)">自動バックアップ：まだ実行されていません。</span>';
  const d=new Date(t);
  return `<span style="color:var(--ok)">自動バックアップ：${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} にiMacへ保存済み</span>`;
}

/* ================= boot ================= */
/* 公開版(github.io)は予備のアドレス。同じアプリに見えて記録は別々に貯まるので、
   ここに付けてしまわないよう開いた瞬間に分かる帯を出す（render()は#appに書くので消えない） */
if(location.hostname.endsWith('github.io')){
  const b=document.createElement('div');
  b.style.cssText='background:var(--warn);color:#fff;padding:10px 13px;font-size:12.5px;line-height:1.55;text-align:center';
  b.innerHTML='⚠️ これは<b>予備のアドレス</b>です。記録はホーム画面のKasaneに付けてください<br>'
             +'<span style="opacity:.85">（ここに付けた記録は別々に貯まり、バックアップもされません）</span>';
  document.body.insertBefore(b,document.body.firstChild);
}
render();
autoBackup();
/* アプリを閉じる/切り替える時にも保存して、その日つけた記録を取りこぼさない */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoBackup(true)});
/* 初めて開いたときだけセットアップを出す（既に記録がある人には出さない） */
if(!CF.setupDone&&!WO.length&&!Object.keys(WT).length)startSetup();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(watchForUpdate).catch(()=>{});
}
</script>
