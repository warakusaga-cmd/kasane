<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasane">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kasane</title>
<style>
:root{
  /* 白ベース。種目イラスト（img/）が白背景なので、そこに合わせている。
     色を変えるときはこの8色だけ触ればアプリ全体が変わる */
  --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f6; --line:#e2e7ef;
  --fg:#171a20; --sub:#6c7685; --accent:#2f6fe4; --ok:#0f9d6b; --warn:#c07800; --bad:#dc3545;
  --navbg:rgba(255,255,255,.94);      /* 下タブの背景（すりガラス） */
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
a{color:var(--accent)}

#app{padding:calc(env(safe-area-inset-top,0px) + 8px) 14px calc(92px + var(--safe-b));max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
header h1{font-size:20px;margin:0;letter-spacing:.02em}
header .meta{color:var(--sub);font-size:13px;margin-left:auto}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{padding:9px 0 8px;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:9px}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12.5px}
.tag{font-size:11px;color:var(--sub);background:var(--card2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.a{color:var(--accent);background:rgba(79,140,255,.13)}
.btn{background:var(--accent);color:#fff;border-radius:11px;padding:11px 14px;text-align:center;font-weight:600;width:100%}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:7px 12px;width:auto;font-size:13px;border-radius:9px}
.btn.nw{white-space:nowrap}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:14px}
h2.sec{font-size:13px;color:var(--sub);margin:20px 2px 9px;font-weight:600;letter-spacing:.04em}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 今日の部位バナー */
.today{background:linear-gradient(135deg,rgba(79,140,255,.18),rgba(79,140,255,.05));
  border:1px solid rgba(79,140,255,.35);border-radius:14px;padding:14px;margin-bottom:12px}
.today.rest{background:linear-gradient(135deg,rgba(139,147,165,.14),rgba(139,147,165,.04));border-color:var(--line)}
.today .big{font-size:22px;font-weight:700;letter-spacing:.01em}
.today .big em{font-style:normal;color:var(--accent)}
.today.rest .big em{color:var(--sub)}

/* 今日のひとこと（記録タブの先頭） */
.daily{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.daily.push{background:linear-gradient(135deg,rgba(255,176,32,.22),rgba(255,176,32,.06));border-color:rgba(214,140,0,.55)}
.daily .hd{font-size:16.5px;font-weight:700;line-height:1.45;margin-top:1px}
.daily .hd em{font-style:normal;color:var(--warn)}
.daily .lead{font-size:13px;line-height:1.65;margin-top:5px}
.daily .fact{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--sub);line-height:1.55;margin-top:8px}
.daily .fact b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.daily .tip{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
.daily .tip .cat{font-size:11px;color:var(--accent);background:rgba(79,140,255,.13);border-radius:6px;padding:3px 8px}
.daily .tip p{margin:7px 0 0;font-size:13px;line-height:1.7}

.menu-i{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--line)}
.menu-i:last-child{border-bottom:0}
.menu-i .rep{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.howto{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--sub);white-space:nowrap}

.exname{font-weight:600;font-size:16px}
.setrow{display:grid;grid-template-columns:26px 1fr 12px 1fr 44px 30px;align-items:center;gap:7px;margin-top:8px}
.setrow .n{color:var(--sub);font-size:12.5px;text-align:center}
.setrow .x{color:var(--sub);text-align:center;font-size:12px}
.setrow input{text-align:center;padding:9px 4px;font-variant-numeric:tabular-nums}
.setrow .chk{border:1px solid var(--line);background:var(--card2);border-radius:9px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.setrow.done .chk{background:rgba(56,211,159,.15);border-color:var(--ok);color:var(--ok)}
.setrow.done input{color:var(--sub)}
.setrow .del{color:var(--sub);font-size:19px;text-align:center;line-height:1}
.setrow.hasph input::placeholder{color:#9aa3b2;opacity:1}

#toast{position:fixed;left:14px;right:14px;bottom:calc(132px + var(--safe-b));z-index:120;
  background:var(--card);border:1px solid var(--ok);color:var(--fg);
  box-shadow:0 10px 30px rgba(16,24,40,.22);
  border-radius:12px;padding:11px 14px;font-size:13.5px;text-align:center;max-width:612px;margin:0 auto;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:none}

.wk{display:grid;grid-template-columns:44px 1fr 46px;align-items:center;gap:9px;margin-bottom:9px}
.wk .trk{position:relative;height:16px;background:var(--card2);border-radius:5px;overflow:hidden}
.wk .band{position:absolute;top:0;bottom:0;background:rgba(56,211,159,.16);border-left:1px solid rgba(56,211,159,.45);border-right:1px solid rgba(56,211,159,.45)}
.wk .bar{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:5px}
.wk .bar.lo{background:#b4bcc9} .wk .bar.hi{background:var(--warn)}
.wk .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}

.plate{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
.plate span{background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.mini{width:100%;height:auto;display:block}
.mini .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.mini .dot{fill:var(--accent)} .mini text{fill:var(--sub);font-size:9px}
.mini .gd{stroke:var(--line);stroke-width:1}
.prev{color:var(--sub);font-size:12px;margin-top:5px;font-variant-numeric:tabular-nums}
.prev b{color:var(--fg);font-weight:500}

#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:60;
  background:var(--card2);border:1px solid var(--accent);border-radius:999px;padding:9px 15px;
  display:none;align-items:center;gap:11px;box-shadow:0 8px 26px rgba(16,24,40,.16)}
#timer.on{display:flex}
#timer .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;min-width:52px;text-align:center}
#timer.fin{border-color:var(--ok)} #timer.fin .t{color:var(--ok)}

#sheet{position:fixed;inset:0;z-index:100;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(16,24,40,.42)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:0 14px calc(20px + var(--safe-b));max-width:640px;margin:0 auto}
#sheet h3{margin:2px 0 12px;font-size:16px}
/* 上部に固定される「つまみ」と閉じるボタン。スクロールしても常に見える */
#sheet .sheet-top{position:sticky;top:0;z-index:3;background:var(--bg);
  margin:0 -14px 8px;padding:10px 0 9px;border-radius:18px 18px 0 0}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
#sheet .sheet-x{position:absolute;right:11px;top:6px;width:32px;height:32px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);color:var(--sub);font-size:13px;line-height:1}
.pickitem{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.pickitem:last-child{border-bottom:0}

/* 図解 */
.figbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 2px;margin-bottom:12px}
.figbox svg{width:100%;max-width:280px;display:block;margin:0 auto}
.figwrap{position:relative;width:100%;max-width:280px;margin:0 auto}
.figwrap img{width:100%;display:block;border-radius:10px}
.figwrap .figB{position:absolute;left:0;top:0;opacity:0}
.figwrap.two .figB{animation:figloop 1.8s ease-in-out infinite}
@keyframes figloop{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.figcap{text-align:center;padding:2px 0 6px;font-size:11.5px}
@media (prefers-reduced-motion:reduce){.figwrap.two .figB{animation:none;opacity:.45}}
.sk{fill:none;stroke:var(--fg);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sk circle{fill:var(--fg);stroke:none}
.eq{fill:var(--accent);stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.gr{stroke:var(--line);stroke-width:3}
.bn{fill:var(--line)}
.ar{stroke:var(--ok);stroke-width:3;fill:none;marker-end:url(#ah)}
.f1{animation:fa 2.2s infinite}.f2{animation:fb 2.2s infinite}
@keyframes fa{0%,40%{opacity:1}50%,100%{opacity:.15}}
@keyframes fb{0%,40%{opacity:.15}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.f1{animation:none;opacity:.3}.f2{animation:none;opacity:1}}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 9px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bullets{padding:0 0 0 18px;margin:0;font-size:13.5px}
.bullets li{margin-bottom:5px}
.bullets.ng{color:var(--bad)}
.bullets.ng li::marker{color:var(--bad)}

/* チャート */
.chart{display:flex;align-items:flex-end;gap:5px;height:110px;margin:6px 0 3px}
.chart .b{flex:1;background:linear-gradient(180deg,var(--accent),#6da2ff);border-radius:4px 4px 0 0;min-height:2px}
.chart .b.z{background:var(--line)}
.xlab{display:flex;gap:5px;color:var(--sub);font-size:10px}
.xlab span{flex:1;text-align:center;overflow:hidden}
.wchart{width:100%;height:auto;display:block}
.wchart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.wchart .avg{fill:none;stroke:var(--ok);stroke-width:2;stroke-dasharray:5 4}
.wchart .tgt{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:3 4}
.wchart .gd{stroke:var(--line);stroke-width:1}
.wchart .dot{fill:var(--accent)}
.wchart text{fill:var(--sub);font-size:9px}
.wchart .area{fill:url(#wg)}

/* 食事（カロリーとPFC） */
.kbar{position:relative;height:11px;background:var(--card2);border-radius:6px;overflow:hidden;margin:12px 0 5px}
.kbar .bar{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:6px}
.kbar .bar.over{background:var(--warn)}
.mac{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;margin-bottom:9px}
.mac .trk{position:relative;height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.mac .bar{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.mac .num{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--sub);white-space:nowrap}
.mac .num b{color:var(--fg);font-weight:600;font-size:14px}
.meal-i{display:flex;align-items:center;gap:9px;padding:9px 2px;border-top:1px solid var(--line)}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;white-space:nowrap}
.chip .sub{font-size:11px;margin-left:3px}

.hist{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .d{font-variant-numeric:tabular-nums;font-weight:600;width:74px;font-size:14px}

.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;flex:none}
.step input{text-align:center;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:12.5px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

/* 初回セットアップ */
#welcome{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;overflow:auto}
#welcome.on{display:block}
#welcome .inner{max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(28px + var(--safe-b));
  min-height:100%;display:flex;flex-direction:column}
#welcome h2{font-size:23px;margin:0 0 6px;line-height:1.35}
#welcome .lead{color:var(--sub);font-size:14px;margin-bottom:20px}
#welcome .body{flex:1}
#welcome .dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
#welcome .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
#welcome .dots i.on{background:var(--accent);width:18px;border-radius:3px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:14px 15px;margin-bottom:9px}
.opt.on{border-color:var(--accent);background:rgba(79,140,255,.12)}
.opt b{display:block;font-size:15.5px;margin-bottom:2px}
.opt span{color:var(--sub);font-size:12.5px;line-height:1.5}
.wfoot{display:flex;gap:9px;align-items:center;margin-top:20px}
.wfoot .skip{color:var(--sub);font-size:13px;padding:11px 4px;white-space:nowrap}
.tips li{margin-bottom:11px;font-size:14px;line-height:1.6}
.tips b{color:var(--accent)}

/* ウォームアップ／ストレッチ */
.wu-h{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.03em;margin:12px 0 5px}
.wu-i{display:flex;align-items:flex-start;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);
  font-size:13.5px;line-height:1.5}
.wu-i:last-child{border-bottom:0}
.wu-i>.grow{cursor:pointer}
.wu-c{width:21px;height:21px;flex:none;margin-top:1px;border:1px solid var(--line);border-radius:6px;
  background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.wu-i.on .wu-c{background:rgba(56,211,159,.16);border-color:var(--ok);color:var(--ok)}
.wu-i.on>.grow{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}

/* 用語ヘルプ */
.term{border-bottom:1px solid var(--line);padding:11px 2px}
.term:last-child{border-bottom:0}
.term b{display:block;font-size:14.5px;margin-bottom:3px}
.term span{color:var(--sub);font-size:13px;line-height:1.6}
.qbtn{border:1px solid var(--line);border-radius:999px;width:26px;height:26px;
  color:var(--sub);font-size:13px;line-height:1;flex:none}
</style>
</head>
<body>
<div id="welcome"><div class="inner" id="welcomeIn"></div></div>
<div id="app"></div>

<div id="timer">
  <button onclick="Timer.add(-15)" class="sub">−15</button>
  <div class="t" id="timerT">0:00</div>
  <button onclick="Timer.add(15)" class="sub">+15</button>
  <button onclick="Timer.stop()" style="color:var(--sub);font-size:18px;line-height:1">×</button>
</div>

<nav>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-3-6 3z"/></svg>記録</button>
  <button data-tab="wt"><svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 3 7-8"/><path d="M4 20h16"/></svg>体重</button>
  <button data-tab="meal"><svg viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 01-16 0z"/><path d="M3 20h18"/><path d="M9.5 8c0-1.4 1.3-1.8 1.3-3.2"/><path d="M13.5 8c0-1.4 1.3-1.8 1.3-3.2"/></svg>食事</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 16v-5m4 5V8m4 8v-3"/></svg>履歴</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10l1.4 1.4m0-12.8l-1.4 1.4m-10 10l-1.4 1.4"/></svg>設定</button>
</nav>

<div id="sheet"><div class="bg" onclick="Sheet.close()"></div>
  <div class="panel">
    <div class="sheet-top">
      <div class="grab"></div>
      <button class="sheet-x" onclick="Sheet.close()" aria-label="閉じる">✕</button>
    </div>
    <div id="sheetP"></div>
    <button class="btn ghost" style="margin-top:18px" onclick="Sheet.close()">閉じる</button>
  </div>
</div>

<!-- ?v= はキャッシュ対策。ブラウザは同じURLだと古いファイルを使い続けるので、
     data.js / figures.js / foods.js を直したら、下の APP_V と一緒にこの数字も上げること -->
<script src="figures.js?v=3.13"></script>
<script src="data.js?v=3.13"></script>
<script src="foods.js?v=3.13"></script>
<script>
/* ================= storage ================= */
const K={ex:'kintore.exercises',wo:'kintore.workouts',cf:'kintore.config',wt:'kintore.weights',
         sv:'kintore.seedVersion',tv:'kintore.timeUnitVersion',wk:'kintore.walks',ml:'kintore.meals'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const SEED=[
  ['ベンチプレス','胸'],['インクラインベンチプレス','胸'],['ダンベルプレス','胸'],
  ['インクラインダンベルプレス','胸'],['チェストプレス','胸'],['インクラインチェストプレス','胸'],
  ['ダンベルフライ','胸'],
  ['ペックフライ','胸'],['ケーブルクロスオーバー','胸'],['ケーブルフライ','胸'],
  ['デッドリフト','背中'],['ルーマニアンデッドリフト','背中'],['ラットプルダウン','背中'],
  ['ベントオーバーロー','背中'],['ワンハンドダンベルロー','背中'],['シーテッドロー','背中'],
  ['Tバーロー','背中'],['懸垂','背中','bw'],['シュラッグ','背中'],['バックエクステンション','背中','bw'],

/* 身長(cm)と体重(kg)からBMI。身長は食事タブの設定と共通（CF.height）。
   未設定なら null（体重は lb 設定でも常にkgで持っている） */
function bmiOf(kg){

  if(!cm||!kg)return null;

}
/* 日本肥満学会の区分。数字だけだと判断できないので一言添える */

/* 部位ごとのインターバル。
   大きい種目ほど長く休まないと次のセットで重量が落ちます。
   脚・背中は神経系の疲労が大きいので長め、単関節の腕・腹は短くてよい。 */
const REST_DEFAULT={'胸':120,'背中':150,'脚':180,'肩':90,'腕':60,'腹':45,'有酸素':0};
/* その部位のインターバル秒数。未設定なら既定値、それも無ければ全体設定 */
const restFor=part=>{
  const v=CF.restBy&&CF.restBy[part];
  if(v!=null)return v;
  if(part in REST_DEFAULT)return REST_DEFAULT[part];
  return CF.rest!=null?CF.rest:90;
};

const saveEX=()=>save(K.ex,EX),saveWO=()=>save(K.wo,WO),saveCF=()=>save(K.cf,CF),saveWT=()=>save(K.wt,WT);

/* ================= date ================= */
const dstr=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr=()=>dstr(new Date());
const dObj=s=>new Date(s+'T00:00:00');
const fmtD=s=>{const[,m,d]=s.split('-');return `${+m}/${+d}(${'日月火水木金土'[dObj(s).getDay()]})`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysBetween=(a,b)=>Math.round((dObj(b)-dObj(a))/86400000);

/* ================= domain ================= */
function getWorkout(date,create){
  let w=WO.find(x=>x.date===date);
  if(!w&&create){w={id:uid(),date,entries:[],memo:''};WO.push(w);WO.sort((a,b)=>a.date<b.date?1:-1);saveWO()}
  return w;
}
function volume(w){
  let v=0;
  for(const en of w.entries){const ex=exById(en.exerciseId);if(!ex||ex.unit==='time')continue;
    for(const s of en.sets)if(s.done)v+=(+s.w||0)*(+s.r||0)}
  return Math.round(v);
}
function lastRecord(exId,beforeDate){
  for(const w of WO){
    if(w.date>=beforeDate)continue;
    const en=w.entries.find(e=>e.exerciseId===exId&&e.sets.some(s=>s.done));
    if(en)return{date:w.date,sets:en.sets.filter(s=>s.done)};
  }
  return null;
}
/* 次回の目標を出す（漸進性過負荷）。
   前回の一番良いセットを見て「まだ余裕がありそうなら重量アップ、そうでなければあと1回」を勧める。
   目安レンジは 8〜12回（筋肥大）。10回以上できていたら重量を上げる合図。 */
function suggestNext(exId,beforeDate){
  const ex=exById(exId);if(!ex)return null;
  const prev=lastRecord(exId,beforeDate||todayStr());
  if(!prev||!prev.sets.length)return null;   // 初回は前例が無いので出さない

  /* バドミントンなどの有酸素は「前回より長く」を目指すものではないので提案しない */
  if(isCardioTime(ex))return null;
  if(ex.unit==='time'){
    const best=Math.max(...prev.sets.map(s=>+s.r||0));
    return {r:best+15,label:`${secLabel(best+15)}（前回より15秒長く）`};
  }
  if(ex.unit==='bw'){
    const best=Math.max(...prev.sets.map(s=>+s.r||0));
    return {r:best+1,label:`${best+1}回（前回+1回）`};
  }
  // kg：前回の一番重いセットと、その重量での最高回数
  let topW=0;for(const s of prev.sets)topW=Math.max(topW,+s.w||0);
  let topR=0;for(const s of prev.sets)if((+s.w||0)===topW)topR=Math.max(topR,+s.r||0);
  // 増やす刻み：小さい重量（ダンベル種目）は1、脚の高重量は5、その他2.5
  const inc=topW<15?1:(ex.part==='脚'&&topW>=50?5:2.5);
  if(topR>=10){
    const nw=Math.round((topW+inc)*4)/4;   // 0.25刻みに丸め
    return {w:nw,r:8,label:`${nw}${CF.unit} × 8回`,why:`前回${topR}回できたので重量アップ`};
  }
  if(topR>=6){
    return {w:topW,r:topR+1,label:`${topW}${CF.unit} × ${topR+1}回`,why:`同じ重量であと1回`};
  }
  return {w:topW,r:topR,label:`${topW}${CF.unit} × ${topR}回`,why:'まずは同じ重量でフォーム重視'};
}
/* 提案を今日の空きセットに入れる */
function applySuggest(exId){
  const w=getWorkout(VIEW_DATE),en=w.entries.find(e=>e.exerciseId===exId);
  const ex=exById(exId),s=suggestNext(exId);if(!en||!s)return;
  for(const set of en.sets){
    if(set.done)continue;
    if(ex.unit==='kg'&&s.w!=null)set.w=String(s.w);
    if(s.r!=null)set.r=String(s.r);
  }
  saveWO();render();
}

function bestSet(exId){
  const ex=exById(exId);if(!ex)return null;
  const byWeight=ex.unit==='kg';let best=null;
  for(const w of WO)for(const en of w.entries){if(en.exerciseId!==exId)continue;
    for(const s of en.sets){if(!s.done)continue;
      const kw=+s.w||0,kr=+s.r||0;
      if(!best||(byWeight?(kw>best.w||(kw===best.w&&kr>best.r)):kr>best.r))best={w:kw,r:kr,date:w.date}}}
  return best;
}
/* 秒数を読みやすく。30 → 30秒 / 90 → 1分30秒 / 120 → 2分 */
function secLabel(v){
  const n=Math.round(+v||0);
  if(n<60)return n+'秒';
  const m=Math.floor(n/60),s=n%60;
  return s?`${m}分${s}秒`:`${m}分`;
}
/* 時間種目でも、プランクは「秒」・バドミントンなどの有酸素は「分」で入力する。
   2時間のバドミントンを7200秒と打つのは現実的でないため */
const isCardioTime=ex=>ex.part==='有酸素'&&ex.unit==='time';
/* 分数を読みやすく。45 → 45分 / 90 → 1時間30分 / 120 → 2時間 */
function minLabel(v){
  const n=Math.round(+v||0);
  if(n<60)return n+'分';
  const h=Math.floor(n/60),m=n%60;
  return m?`${h}時間${m}分`:`${h}時間`;
}
function setLabel(ex,s){
  if(isCardioTime(ex))return minLabel(s.r);
  if(ex.unit==='time')return secLabel(s.r);
  if(ex.unit==='bw')return `${s.r||0}回`;
  return `${s.w||0}${CF.unit}×${s.r||0}`;
}
const bestLabel=(ex,b)=>setLabel(ex,{w:b.w,r:b.r});

/* 1RM推定（Epley式）。高レップは誤差が大きいので12回までを対象にする */
function epley(w,r){w=+w;r=+r;if(!w||!r||r>12)return 0;return w*(1+r/30)}
function oneRM(exId){
  const ex=exById(exId);if(!ex||ex.unit!=='kg')return null;
  let best=null;
  for(const w of WO)for(const en of w.entries){if(en.exerciseId!==exId)continue;
    for(const s of en.sets){if(!s.done)continue;const v=epley(s.w,s.r);
      if(v&&(!best||v>best.v))best={v,date:w.date,w:+s.w,r:+s.r}}}
  return best;
}
/* セッションごとの推定1RM推移 */
function rmSeries(exId){
  const out=[];
  for(const w of [...WO].reverse()){
    const en=w.entries.find(e=>e.exerciseId===exId);if(!en)continue;
    let mx=0;for(const s of en.sets)if(s.done)mx=Math.max(mx,epley(s.w,s.r));
    if(mx)out.push({d:w.date,v:mx});
  }
  return out;
}
/* 部位別の週間セット数（完了セットのみ） */
function weekSets(offset){
  const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-b.getDay()-offset*7);
  const e=new Date(b);e.setDate(e.getDate()+7);
  const from=dstr(b),to=dstr(e),m={};
  for(const p of PARTS)m[p]=0;
  for(const w of WO){
    if(w.date<from||w.date>=to)continue;
    for(const en of w.entries){
      const ex=exById(en.exerciseId);if(!ex||ex.part==='有酸素')continue;
      m[ex.part]+=en.sets.filter(s=>s.done).length;
    }
  }
  return {from,to,m};
}

/* ========= 今日のおすすめ部位 =========
   曜日の予定に縛られず、「最近やっていない＝回復済みの部位」を勧める（Fitbod的な考え方）。
   Push/Pull/Legs 単位で、最後にやってからの経過日数が最大のものを選ぶ。
   同点なら今週のセット数が少ない方。当日すでにやった部位は候補から外す。 */
function lastTrainedByPart(){
  const last={};
  for(const w of WO){
    for(const en of w.entries){
      const ex=exById(en.exerciseId);
      if(!ex||ex.part==='有酸素'||!en.sets.some(s=>s.done))continue;
      if(!last[ex.part]||w.date>last[ex.part])last[ex.part]=w.date;
    }
  }
  return last;
}
function recommendPart(date){
  const today=date||todayStr();
  const last=lastTrainedByPart();
  const wk=weekSets(0).m;
  const daysSince=p=>{
    const ds=GROUPS[p].map(q=>last[q]).filter(Boolean).sort();
    if(!ds.length)return 999;                     // 一度もやっていない＝最優先
    return Math.round((dObj(today)-dObj(ds[ds.length-1]))/86400000);
  };
  const wkSets=p=>GROUPS[p].reduce((a,q)=>a+(wk[q]||0),0);
  const scored=['Push','Pull','Legs']
    .map(p=>({p,d:daysSince(p),s:wkSets(p)}))
    .filter(g=>g.d>0)                             // 今日やった部位は除く
    .sort((a,b)=>b.d-a.d||a.s-b.s);
  const best=scored[0]||{p:'Push',d:999,s:0};
  const reason=best.d>=999?'まだ記録がありません。ここから始めましょう'
    :best.d>=14?`しばらく空いています（前回${best.d}日前）`
    :`${best.d}日空いていて回復済みです`;
  return {group:best.p,days:best.d,reason};
}

/* ========= 時間からメニューを組む =========
   1セット ＝ 動作40秒 ＋ インターバル
   1種目あたり SETUP_MIN ＝ 移動・重量セット・プレート付け替えの2分
   全体に ウォームアップ6分
   → 持ち時間に入るぶんだけ、優先順位（MENUSの並び順）の高い種目から詰めていく */
const WARMUP_MIN=6, WORK_SEC=40, SETUP_MIN=2;
const minPerSet=part=>(WORK_SEC+restFor(part))/60;

/* その部位でやれる種目の候補。MENUSの分を優先し、時間が余ったら同部位の他の種目を足す */
function candidatesFor(part){
  const M=MENUS[part];
  /* 動作に合わない種目（GROUP_EXCLUDE）に加えて、
     通っているジムに器具が無い種目（NO_EQUIP）も、おすすめには出さない */
  const ng=[...(GROUP_EXCLUDE[part]||[]),...(typeof NO_EQUIP!=='undefined'?NO_EQUIP:[])];
  /* fin:1 のメニューは、最後の1種目が「締めのケーブル種目」。
     時間で削られないよう印を付けて、fillPart 側で別扱いにする */
  const out=M?M.items
      .map(([name,sets,rep,note],i)=>({name,base:sets,rep,note,finisher:!!(M.fin&&i===M.items.length-1)}))
      .filter(c=>!ng.includes(c.name)):[];
  const mk=e=>({name:e.name,base:e.unit==='time'?2:3,
    rep:e.unit==='time'?'60秒':e.unit==='bw'?'限界まで':'10〜12回',note:'時間が余ったら',extra:true});
  /* 「時間が余ったら」枠は部位ごとに1つずつ交互に取る。
     部位順にまとめて並べると、先頭の部位（胸）だけで上限まで埋まってしまうため。 */
  const pools=expandParts([part]).map(p=>
    EX.filter(e=>e.part===p&&e.part!=='有酸素'&&!ng.includes(e.name)&&!out.some(o=>o.name===e.name)));
  for(let i=0;pools.some(pool=>pool[i]);i++)
    for(const pool of pools)if(pool[i])out.push(mk(pool[i]));
  return out;
}
/* 持ち時間ぶんだけ種目を選ぶ。
   時間が余っても1つの部位を延々と増やさないよう、1回あたり SESSION_CAP セットで打ち止めにする
   （週10〜20セット/部位の目安を、週2回に割ったときの上限） */
const SESSION_CAP=12;
function fillPart(part,budgetMin){
  const all=candidatesFor(part);
  const fin=all.find(c=>c.finisher);                     // 締めのケーブル種目（無いメニューもある）
  const cands=all.filter(c=>!c.finisher);
  const chosen=[],load={};                               // load: 実際の部位 → このセッションのセット数
  const partOf=n=>{const e=exByName(n);return e?e.part:null};
  /* インターバルは部位ごとに違うので、1セットの所要時間も種目ごとに変わる */
  const mpsOf=n=>minPerSet(partOf(n)||part);
  /* 締めだけは SESSION_CAP を2セットだけ超えてよい。
     枠を先に取り置くやり方だと、締めを入れるかわりに主要種目（背中のベントオーバーローなど）が
     落ちてしまった。締めは軽いケーブル種目なので、上限を少し超えるほうが実害が小さい。 */
  const finPart=fin?partOf(fin.name):null;
  let finBonus=false;
  const room=n=>{const p=partOf(n);if(!p)return 99;
    const cap=SESSION_CAP+((finBonus&&p===finPart)?2:0);
    return Math.max(0,cap-(load[p]||0))};
  let left=budgetMin;
  /* 締めのぶんの時間を先に取り置く。
     そうしないと、持ち時間が短い日に真っ先に締めが削られてしまう
     （締めこそ最後まで残したい種目なので、順番どおりに詰めると本末転倒になる） */
  const holdFor=fin?Math.min(budgetMin,SETUP_MIN+2*mpsOf(fin.name)):0;
  left-=holdFor;
  for(const c of cands){
    const mps=mpsOf(c.name);
    if(left<SETUP_MIN+2*mps)continue;                    // これは入らないが、休みの短い部位ならまだ入る
    const sets=Math.min(c.base,room(c.name),Math.floor((left-SETUP_MIN)/mps));
    if(sets<2)continue;                                  // この種目は入らない（部位が埋まった等）→ 次の候補へ
    chosen.push(Object.assign({},c,{sets}));
    left-=SETUP_MIN+sets*mps;
    const p=partOf(c.name);if(p)load[p]=(load[p]||0)+sets;
  }
  for(const c of chosen){                                // 端数で1セットずつ増やす
    const mps=mpsOf(c.name);
    while(left>=mps&&c.sets<c.base+1&&room(c.name)>0){
      c.sets++;left-=mps;const p=partOf(c.name);if(p)load[p]++;
    }
  }
  /* 取り置いたぶんを戻して、締めをいちばん最後に足す。
     「時間が余ったら」枠より後ろに来るので、締めは必ずメニューの最後になる */
  if(fin&&chosen.length){
    left+=holdFor;finBonus=true;          // 取り置いた時間を戻し、締めぶんの枠を開ける
    const mps=mpsOf(fin.name);
    const sets=Math.min(fin.base,room(fin.name),Math.floor((left-SETUP_MIN)/mps));
    if(sets>=2){
      chosen.push(Object.assign({},fin,{sets}));
      left-=SETUP_MIN+sets*mps;
      const p=partOf(fin.name);if(p)load[p]=(load[p]||0)+sets;
    }
  }
  return {items:chosen,used:budgetMin-left};
}

function planMenu(parts,budgetMin){
  const plan=[];
  const strength=parts.filter(p=>p!=='有酸素');
  const cardio=parts.filter(p=>p==='有酸素');
  let cardioMin=0;
  // 有酸素だけの日は持ち時間をまるごと使う（上限60分）。筋トレと同じ日なら3割まで
  if(cardio.length)cardioMin=strength.length?Math.min(20,Math.round(budgetMin*0.3)):Math.min(60,budgetMin-5);

  const pool=Math.max(0,budgetMin-WARMUP_MIN-cardioMin);
  const baseOf=p=>MENUS[p]?MENUS[p].items.reduce((a,i)=>a+i[1],0):9;
  const totalBase=strength.reduce((a,p)=>a+baseOf(p),0)||1;
  let spent=0;
  strength.forEach((p,idx)=>{
    const share=idx===strength.length-1?pool-spent:pool*baseOf(p)/totalBase;
    const r=fillPart(p,share);spent+=r.used;
    if(r.items.length)plan.push({part:p,aim:(MENUS[p]||{}).aim||'',items:r.items});
  });
  if(cardio.length){
    const it=MENUS['有酸素'].items[0];
    /* 毎回ランニング固定だと、バドミントンの人は毎回選び直しになる。
       前回やった有酸素種目があればそれを出す（初回だけ既定のランニング） */
    const lastC=(()=>{
      for(const w of WO)for(const en of w.entries){
        const ex=exById(en.exerciseId);
        if(ex&&ex.part==='有酸素'&&en.sets.some(s=>s.done)){
          const min=en.sets.reduce((a,s)=>a+(s.done?+s.r||0:0),0);
          return {name:ex.name,min};
        }
      }return null})();
    const name=lastC?lastC.name:it[0];
    const note=lastC?(lastC.name===it[0]?it[3]:`前回は${minLabel(lastC.min)}`):it[3];
    plan.push({part:'有酸素',aim:MENUS['有酸素'].aim,
      items:[{name,sets:1,base:1,rep:cardioMin+'分',note,minutes:cardioMin}]});
  }
  /* 所要時間の見積りも、種目それぞれの部位のインターバルで計算する */
  let est=WARMUP_MIN+cardioMin;
  for(const g of plan)for(const it of g.items){
    if(it.minutes)continue;
    const e=exByName(it.name);
    est+=SETUP_MIN+it.sets*minPerSet(e?e.part:g.part);
  }
  const totalSets=plan.reduce((a,g)=>a+g.items.reduce((b,i)=>b+(i.minutes?0:i.sets),0),0);
  return {plan,totalSets,estMin:Math.round(est)};
}

/* ================= 終了アラーム =================
   ジムでは「ピッ」1回では気づけないので、気づくまで鳴らし続ける方式。

   ・Web Audio で鳴らす。iOSではメディア音（<audio>）と違って再生権を奪わないので、
     バックグラウンドの音楽やポッドキャストを止めずに、上に重ねて鳴る。
     （2026-07-30に<audio>方式から変更。<audio>だと音楽が完全停止し、復帰も手動だったため）
   ・そのかわりマナーモード（消音スイッチ）では鳴らない場合がある。
     音楽を再生しながらなら消音スイッチに関係なく重なって鳴る。
   ・iOSは「一度もタップされていないページ」では音を出せないので、
     最初のタップで AudioContext を起こしておく（unlock）
   ・鳴っている間に画面のどこかを触れば止まる */
const ALARM={
  _ac:null,master:null,ringing:false,stopT:null,vibT:null,
  /* 何秒鳴らすか。off=鳴らさない。
     旧設定「1回(short)」は廃止した（短くて気づけない、が作り直しの理由だったため）。
     選んでいた人は6秒に読み替える */
  SECS:{off:0,normal:6,loud:20},
  level(){const v=CF.alarm||'loud';return v==='short'?'normal':v},

  ctx(){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    if(!this._ac)this._ac=new C();
    if(this._ac.state==='suspended')this._ac.resume().catch(()=>{});
    return this._ac;
  },
  /* 最初のタップで呼ぶ。AudioContextはタップ起点でしか始動できないため */
  unlock(){this.ctx()},

  /* 「ピッ ピッ ピッ …」（0.9秒周期）を secs 秒ぶん先までまとめて予約する。
     スマホのスピーカーは1〜3kHzがいちばんよく鳴るので、その帯域＋倍音 */
  play(sec){
    const secs=sec!=null?sec:this.SECS[this.level()];
    if(!secs)return;
    this.stop();
    const c=this.ctx();if(!c)return;
    const g=c.createGain();g.connect(c.destination);
    this.master=g;
    const beep=(t,f)=>{
      for(const[m,amp]of[[1,.5],[2,.22],[3,.09]]){
        const o=c.createOscillator(),og=c.createGain();
        o.frequency.value=f*m;o.connect(og);og.connect(g);
        og.gain.setValueAtTime(.0001,t);
        og.gain.exponentialRampToValueAtTime(amp,t+.012);
        og.gain.setValueAtTime(amp,t+.11);
        og.gain.exponentialRampToValueAtTime(.0001,t+.15);
        o.start(t);o.stop(t+.16);
      }
    };
    const t0=c.currentTime+.03;
    for(let i=0;i<Math.ceil(secs/.9);i++){
      const t=t0+i*.9;
      beep(t,1175);beep(t+.17,1568);beep(t+.34,1175);
    }
    this.ringing=true;
    if(navigator.vibrate){navigator.vibrate([250,120,250]);
      this.vibT=setInterval(()=>navigator.vibrate([250,120,250]),900)}
    this.stopT=setTimeout(()=>this.stop(),secs*1000+150);
  },
  stop(){
    clearTimeout(this.stopT);clearInterval(this.vibT);this.stopT=this.vibT=null;
    /* 予約済みの音はマスターの線を抜いてまとめて黙らせる */
    if(this.master){try{this.master.disconnect()}catch(e){}this.master=null}
    if(this.ringing&&navigator.vibrate)navigator.vibrate(0);
    this.ringing=false;
  },
  /* 設定タブの「鳴らしてみる」。どの設定でも約3秒鳴らす */
  test(){
    if(this.level()==='off'){toast('いまは「鳴らさない」に設定されています');return}
    this.unlock();this.play(3);
    toast('鳴っています。画面をタップすると止まります');
  }
};
/* 最初のタップでオーディオを起こす／鳴っているときはタップで止める */
document.addEventListener('pointerdown',()=>{

},{passive:true});

/* インターバル中に画面が消えると、タイマーもアラームも止まってしまう。
   対応している端末では画面を点けたままにする（対応していなければ何もしない） */
let WAKE=null;
async function keepAwake(on){
  try{
    if(on){
      if(!navigator.wakeLock||WAKE)return;
      WAKE=await navigator.wakeLock.request('screen');
      WAKE.addEventListener('release',()=>{WAKE=null});
    }else if(WAKE){const w=WAKE;WAKE=null;await w.release()}
  }catch(e){WAKE=null}
}

const seg=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
const mrx=p=>[200-p[0],p[1]];
function bodyG(P,mir){
  let s=seg(P.n,P.hip)+seg(P.n,P.e)+seg(P.e,P.w)+seg(P.hip,P.k)+seg(P.k,P.f);
  if(mir)s+=seg(P.n,mrx(P.e))+seg(mrx(P.e),mrx(P.w))+seg(P.hip,mrx(P.k))+seg(mrx(P.k),mrx(P.f));
  return s+`<circle cx="${P.h[0]}" cy="${P.h[1]}" r="9"/>`;
}
function eqG(P,t,mir){
  if(!t||t==='topbar'||t==='dipbars')return'';
  const w=P.w,db=q=>`<rect x="${q[0]-10}" y="${q[1]-5}" width="20" height="10" rx="3"/>`;
  if(t==='plate')return `<rect x="${w[0]-5}" y="${w[1]-14}" width="10" height="28" rx="5"/>`;
  if(t==='db')return db(w)+(mir?db(mrx(w)):'');
  if(t==='backbar')return `<line x1="${P.n[0]-36}" y1="${P.n[1]}" x2="${P.n[0]+36}" y2="${P.n[1]}"/>`;
  if(t==='wheel')return `<circle cx="${w[0]}" cy="${w[1]+8}" r="9" fill="none"/>`;
  if(t==='pad')return `<circle cx="${P.f[0]+8}" cy="${P.f[1]}" r="8"/>`;
  return'';
}
function figSVG(key){

/* ================= 種目の記録 / プレート計算 ================= */
function miniChart(pts,unit){
  if(pts.length<2)return '';
  const W=300,H=110,PL=30,PR=6,PT=10,PB=18;
  const x0=dObj(pts[0].d).getTime(),x1=dObj(pts[pts.length-1].d).getTime(),span=Math.max(1,x1-x0);
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const pad=Math.max(1,(hi-lo)*0.2);lo-=pad;hi+=pad;
  const X=d=>PL+(dObj(d).getTime()-x0)/span*(W-PL-PR);
  const Y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
  const lab=d=>{const[,m,dd]=d.split('-');return `${+m}/${+dd}`};
  return `<svg class="mini" viewBox="0 0 ${W} ${H}">
    ${[hi-pad*0.5,lo+pad*0.5].map(v=>`<line class="gd" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}"/>
      <text x="2" y="${(Y(v)+3).toFixed(1)}">${v.toFixed(1)}</text>`).join('')}
    <path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}"/>
    ${pts.map(p=>`<circle class="dot" cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.4"/>`).join('')}
    <text x="${PL}" y="${H-4}">${lab(pts[0].d)}</text>
    <text x="${W-PR}" y="${H-4}" text-anchor="end">${lab(pts[pts.length-1].d)}</text>
  </svg>`;
}

    <div class="sub" style="margin-bottom:9px">バーの片側に何を入れるかを出します</div>
    <div class="row" style="margin-bottom:9px">
      <span class="grow">目標の総重量</span>
      <input id="pcW" type="number" inputmode="decimal" step="0.5" value="${init}" placeholder="60" style="width:110px;text-align:center" oninput="plateRun()"> <span class="sub">${CF.unit}</span></div>
    <div class="row" style="margin-bottom:12px">
      <span class="grow">シャフトの重さ</span>
      <input id="pcB" type="number" inputmode="decimal" step="0.5" value="${CF.bar??20}" style="width:110px;text-align:center" oninput="CF.bar=+this.value;saveCF();plateRun()"> <span class="sub">${CF.unit}</span></div>
    <div id="pcOut"></div>`);
  plateRun();
}
function plateRun(){
  const total=+document.getElementById('pcW').value,bar=+document.getElementById('pcB').value;
  const out=document.getElementById('pcOut');
  if(!total){out.innerHTML=`<div class="empty" style="padding:24px">重量を入れてください</div>`;return}
  if(total<bar){out.innerHTML=`<div class="empty" style="padding:24px">シャフト（${bar}${CF.unit}）より軽い重量です</div>`;return}
  let side=(total-bar)/2,used=[],rest=side;
  for(const p of PLATES){while(rest>=p-1e-9){used.push(p);rest=+(rest-p).toFixed(3)}}
  const made=bar+(side-rest)*2;
  out.innerHTML=`<div class="card">
    <div class="sub" style="text-align:center">片側 ${fmtN(side-rest)}${CF.unit} ぶん</div>
    <div class="plate">${used.length?used.map(p=>`<span>${p}</span>`).join(''):'<span style="background:var(--card2);color:var(--sub)">プレートなし</span>'}</div>
    <div style="text-align:center;font-size:15px">合計 <b>${fmtN(made)}${CF.unit}</b>
      ${rest>0.01?`<span class="sub"> （あと${fmtN(rest*2)}${CF.unit} は作れません）</span>`:''}</div>
  </div>
  <div class="sub" style="font-size:11.5px">使用プレート: ${PLATES.join(' / ')}${CF.unit}。左右対称に入れてください。</div>`;
}

/* ================= router ================= */
let TAB='log',VIEW_DATE=todayStr(),WT_DATE=todayStr();
/* タブ移動＝一番上へ。セットの✓など画面内の操作＝スクロール位置を保つ */
function go(t){TAB=t;if(t==='log')VIEW_DATE=todayStr();if(t==='meal')MEAL_DATE=todayStr();if(t==='wt')WT_DATE=todayStr();render(true)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(toTop){
  const y=window.scrollY;
  /* 再描画で上の要素（ウォームアップカードの畳みなど）の高さが変わっても位置がズレないよう、
     画面内の最初のセット行を目印にして、その見た目の位置を保つ */
  let anchor=null;
  if(!toTop)for(const r of document.querySelectorAll('.setrow')){
    const rect=r.getBoundingClientRect();
    if(rect.bottom>0){anchor={ex:r.dataset.ex,i:r.dataset.i,top:rect.top};break}
  }
  /* 種目タブは設定の中の画面なので、ナビは設定を光らせる */
  const navFor=TAB==='ex'?'set':TAB;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===navFor));
  document.getElementById('app').innerHTML=({log:viewLog,wt:viewWt,meal:viewMeal,hist:viewHist,ex:viewEx,set:viewSet})[TAB]();
  if(toTop){window.scrollTo(0,0);return}
  if(anchor){
    const el=document.querySelector(`.setrow[data-ex="${anchor.ex}"][data-i="${anchor.i}"]`);
    if(el){window.scrollTo(0,window.scrollY+(el.getBoundingClientRect().top-anchor.top));return}
  }
  window.scrollTo(0,y);
}

/* ================= 今日のひとこと =================
   アプリを開くたびに、記録から拾った「経過報告」と「ワンポイント」を記録タブの先頭に出す。
   ジムから足が遠のいているときは、見出しを背中を押す文面に切り替える。
   毎回同じだと読まなくなるので、日付で中身が回るようにしている（「別のを見る」で手動送りも可）。 */
const dayNum=()=>Math.floor(dObj(todayStr()).getTime()/86400000);
const rotN=()=>dayNum()+(CF.tipShift||0);

/* 実際にやった日（完了セットが1つ以上ある日）を新しい順で。未来日は数えない */
function doneDays(){
  const t=todayStr();
  return WO.filter(w=>w.date<=t&&w.entries.some(en=>en.sets.some(s=>s.done)));
}
const partsDone=w=>[...new Set(w.entries
  .filter(en=>en.sets.some(s=>s.done))
  .map(en=>(exById(en.exerciseId)||{}).part).filter(Boolean))];

/* 週1回以上が何週つづいているか。今週まだでも、先週まで続いていれば継続とみなす */
function weekStreak(){
  let n=0;
  for(let i=0;i<104;i++){
    const b=new Date();b.setHours(0,0,0,0);b.setDate(b.getDate()-b.getDay()-i*7);
    const e=new Date(b);e.setDate(e.getDate()+7);
    const from=dstr(b),to=dstr(e);
    const has=WO.some(w=>w.date>=from&&w.date<to&&w.entries.some(s0=>s0.sets.some(s=>s.done)));
    if(has)n++;else if(i>0)break;
  }
  return n;
}

/* 経過報告でコケても、カード自体（見出しとワンポイント）は出るようにする */
function progressFacts(){
  try{return progressFactsBody()}catch(e){console.error('progressFacts で例外',e);return []}
}
/* 記録から「今言えること」を集める。良い知らせほど前に来る。
   数字は <b> で強調して返すので、埋め込む名前だけ esc() すること */
function progressFactsBody(){
  const t=todayStr(),done=doneDays(),out=[];
  if(!done.length)return out;
  const since=dstr(new Date(dObj(t).getTime()-6*86400000));   // 直近7日

  /* 直近7日に更新した自己ベスト。初回記録は「更新」に数えない（2回以上やった種目だけ） */
  const ids=new Set();
  for(const w of done)if(w.date>=since)for(const en of w.entries)ids.add(en.exerciseId);
  const prs=[];
  for(const id of ids){
    const ex=exById(id);if(!ex)continue;
    if(done.filter(w=>w.entries.some(en=>en.exerciseId===id&&en.sets.some(s=>s.done))).length<2)continue;
    const b=bestSet(id);
    if(b&&b.date>=since)prs.push(`${esc(ex.name)} ${esc(bestLabel(ex,b))}`);
  }
  if(prs.length)out.push({i:'🎉',t:`この7日で自己ベスト更新 <b>${prs.slice(0,2).join('・')}</b>${
    prs.length>2?` ほか${prs.length-2}種目`:''}`});

  /* 推定1RMがいちばん伸びている種目 */
  let g=null;
  for(const id of ids){
    const ex=exById(id);if(!ex||ex.unit!=='kg')continue;
    const s=rmSeries(id);if(s.length<2)continue;
    const now=s[s.length-1];
    const old=s.filter(p=>daysBetween(p.d,now.d)>=21).pop()||s[0];
    if(old.d===now.d)continue;
    const d=now.v-old.v;
    if(d>=1&&(!g||d>g.d))g={name:ex.name,d,days:daysBetween(old.d,now.d),v:now.v};
  }
  if(g)out.push({i:'📈',t:`${esc(g.name)}の推定1RMはこの${g.days}日で <b>+${g.d.toFixed(1)}${CF.unit}</b>（いま約${Math.round(g.v)}${CF.unit}）`});

  /* 今月の回数を、先月の同じ日までと比べる */
  const day=+t.slice(8);
  let[py,pm]=t.split('-').map(Number);pm--;if(pm===0){pm=12;py--}
  const pym=`${py}-${String(pm).padStart(2,'0')}`;
  const thisM=done.filter(w=>w.date.slice(0,7)===t.slice(0,7)).length;
  const prevM=done.filter(w=>w.date.slice(0,7)===pym&&+w.date.slice(8)<=day).length;
  if(thisM||prevM)out.push({i:'📅',t:`今月は <b>${thisM}回</b>。先月の同じ日までは${prevM}回でした${
    thisM>prevM?'（いいペースです）':''}`});

  /* 今週のセット数と、いちばん多い部位 */
  const wk=weekSets(0).m;
  const cnt=PARTS.filter(p=>p!=='有酸素');
  const wkTotal=cnt.reduce((a,p)=>a+wk[p],0);
  if(wkTotal){
    const top=cnt.slice().sort((a,b)=>wk[b]-wk[a])[0];
    out.push({i:'🔥',t:`今週はここまで <b>${wkTotal}セット</b>${wk[top]?`（いちばん多いのは${esc(top)}の${wk[top]}セット）`:''}`});
  }

  /* 週1回以上を何週つづけているか */
  const ws=weekStreak();
  if(ws>=2)out.push({i:'🗓',t:`週1回以上が <b>${ws}週つづいて</b>います`});

  /* 通算の節目が近いとき */
  const marks=[10,20,30,50,75,100,150,200,300,365,500];
  const nx=marks.find(m=>m>done.length);
  if(nx&&nx-done.length<=3)out.push({i:'🏅',t:`通算${done.length}回。あと <b>${nx-done.length}回</b>で${nx}回です`});

  /* これまでに持ち上げた総重量 */
  const vol=done.reduce((a,w)=>a+volume(w),0);
  if(vol>=1000)out.push({i:'🏋️',t:`これまでに持ち上げた合計は <b>${(vol/1000).toFixed(1)}t</b>（通算${done.length}回ぶん）`});

  /* 体重の3週間前くらいとの差 */
  const wts=wtSorted();
  if(wts.length>=2){
    const now=wts[wts.length-1];
    const base=wts.filter(x=>daysBetween(x.d,now.d)>=21).pop()||wts[0];
    const d=now.w-base.w;
    if(base.d!==now.d&&Math.abs(d)>=0.5)
      out.push({i:'⚖️',t:`体重はこの${daysBetween(base.d,now.d)}日で <b>${d>0?'+':''}${d.toFixed(1)}kg</b>（いま${now.w.toFixed(1)}kg）`});
  }

  /* 今週のウォーキング */
  const wm=walkWeekMin();
  if(wm>=30){
    const st=walkStreak();
    out.push({i:'🚶',t:`今週のウォーキングは <b>${wm}分</b>・約 <b>${walkWeekKcal()}kcal</b>${st>=3?`・${st}日連続`:''}`});
  }
  /* 歩いて減らしたぶんが積み上がっているのが見えると続きます */
  const wtk=walkTotalKcal();
  if(wtk>=2000)out.push({i:'🔥',t:`歩いて減らした合計は <b>${wtk.toLocaleString()}kcal</b>（脂肪 約${kcalFat(wtk).toFixed(1)}kg ぶん）`});
  return out;
}

function tipOfDay(){
  const n=((rotN()%TIPS.length)+TIPS.length)%TIPS.length;
  return TIPS[n];
}
function nextTip(){CF.tipShift=(CF.tipShift||0)+1;saveCF();render()}

/* このカードで何かあっても、記録タブ自体は必ず開けるようにする。
   （data.js だけ古いキャッシュが残って TIPS が無い、想定外の記録が入っている、など） */
function dailyCard(date){
  try{
    if(typeof TIPS==='undefined'||typeof COMEBACK==='undefined')return '';
    return dailyCardBody(date);
  }catch(e){
    console.error('dailyCard で例外',e);
    return '';
  }
}
function dailyCardBody(date){
  if(date!==todayStr())return '';
  const done=doneDays(),w=getWorkout(date);
  const last=done.find(x=>x.date<date);
  const gap=last?daysBetween(last.date,date):null;
  const todaySets=w?w.entries.reduce((a,en)=>a+en.sets.filter(s=>s.done).length,0):0;

  let push=false,head,lead='';
  if(!done.length){
    head='ようこそ。ここから始めましょう';
    lead='1回でも記録すると、次からここに経過報告が出るようになります。';
  }else if(w&&w.finished){
    head='今日はもう完了しています';
    /* REST_TIPSの文は下の部位バナー（休養日）にも出るので、ここでは使わない（同じ文が2回並ぶ） */
    lead='お疲れさまでした。今日の内容は下の「まとめ」から見返せます。';
  }else if(todaySets){
    head=`今日はここまで <em>${todaySets}セット</em>`;
    lead='この調子で。終わったら下の「完了する」を押してください。';
  }else if(gap>=4){
    push=true;
    head=`前回のトレから <em>${gap}日</em> 空いています`;
    /* 空いた日数が長いほど後ろの文面から始め、そこから日替わりでずらす */
    lead=COMEBACK[((gap>=14?3:gap>=7?2:0)+(rotN()%3))%COMEBACK.length];
    /* 始めるボタンは置かない。すぐ下の「今日は◯◯の日」バナーが同じ役目をしていて、
       同じ画面に同じボタンが2つあると迷うため */
  }else{
    /* ふだんの日。あいさつより前回の情報のほうが役に立つので、そちらを見出しにする。
       gapはここでは1〜3日（4日以上は上の「久しぶり」分岐に入る） */
    const pd=partsDone(last);
    head=`前回は${fmtD(last.date)}${pd.length?`の<em style="color:var(--accent)">${esc(pd.join('・'))}</em>`:''}`;
    lead=gap===1?'昨日に続けて。いい流れです。':`${gap}日空き。ちょうど回復できた頃です。`;
  }

  const facts=progressFacts();
  let show=[];
  if(facts.length){
    show=[facts[0]];
    if(facts.length>1)show.push(facts[1+(rotN()%(facts.length-1))]);
  }
  const tip=tipOfDay();
  /* 日付はヘッダー右上に出ているので、カードには載せない（二重表示になる） */
  return `<div class="daily${push?' push':''}">
    <div class="hd">${head}</div>
    ${lead?`<div class="lead">${lead}</div>`:''}
    ${show.map(f=>`<div class="fact"><span>${f.i}</span><span class="grow">${f.t}</span></div>`).join('')}
    <div class="tip">
      <div class="row"><span class="cat">今日のワンポイント・${esc(tip.c)}</span>
        <button class="howto" style="margin-left:auto" onclick="nextTip()">別のを見る</button></div>
      <p>${esc(tip.t)}</p>
    </div>
  </div>`;
}

        <div class="row">

        h+=`<div class="row" style="margin-top:5px;gap:8px;background:rgba(56,211,159,.10);border:1px solid rgba(56,211,159,.35);border-radius:9px;padding:7px 10px">
          <div class="grow" style="min-width:0"><span style="color:var(--ok);font-size:12px">次はこれ</span>
            <b style="font-size:13.5px"> ${esc(sg.label)}</b>
            ${sg.why?`<div class="sub" style="font-size:11px">${esc(sg.why)}</div>`:''}</div>
          <button class="btn sm nw" onclick="applySuggest('${en.exerciseId}')">入れる</button></div>`;
      en.sets.forEach((s,i)=>{
        const wDis=ex.unit!=='kg';
        const phw=s.ph&&s.ph.w!==''&&s.ph.w!=null?s.ph.w:'kg';
        const phr=s.ph&&s.ph.r!==''&&s.ph.r!=null?s.ph.r:(isCardioTime(ex)?'分':ex.unit==='time'?'秒':'回');
        h+=`<div class="setrow${s.done?' done':''}${s.ph?' hasph':''}" data-ex="${en.exerciseId}" data-i="${i}">
          <div class="n">${i+1}</div>
          ${isCardioTime(ex)
              ?`<div class="sub" style="text-align:center;font-size:12px">時間（分）</div>`
            :ex.unit==='time'
              ?`<button class="btn ghost sm nw" style="padding:7px 0;font-size:12px" onclick="startSetTimer('${en.exerciseId}',${i})">▶ 計測</button>`
            :wDis?`<div class="sub" style="text-align:center;font-size:12px">自重</div>`
                :`<input type="text" inputmode="decimal" enterkeyhint="done" placeholder="${phw}" value="${s.w??''}" oninput="setVal('${en.exerciseId}',${i},'w',this)">`}
          <div class="x">${ex.unit==='time'?'':'×'}</div>
          <input type="text" inputmode="${ex.unit==='kg'?'numeric':'decimal'}" enterkeyhint="done" placeholder="${phr}" value="${s.r??''}" oninput="setVal('${en.exerciseId}',${i},'r',this)">
          <button class="chk" onclick="toggle('${en.exerciseId}',${i})">✓</button>
          <button class="del" onclick="rmSet('${en.exerciseId}',${i})">−</button>
        </div>`;
      });
      h+=`<div class="row" style="margin-top:9px;gap:7px">
        <button class="btn ghost sm nw" onclick="addSet('${en.exerciseId}')">＋ セット</button>
        ${ex.unit==='kg'?`<button class="btn ghost sm nw" onclick="plateCalc('${en.exerciseId}')">プレート</button>`:''}
        <button class="btn ghost sm nw" style="margin-left:auto" onclick="showExDetail('${en.exerciseId}')">記録</button>
      </div></div>`;
    }
    h+=`<div class="card row" style="justify-content:space-between"><span class="sub">総ボリューム</span>
      <b style="font-variant-numeric:tabular-nums">${volume(w).toLocaleString()} ${CF.unit}</b></div>`;
    h+=`<div class="card"><div class="sub" style="margin-bottom:6px">メモ</div>
      <textarea rows="2" placeholder="調子・体重など" onchange="setMemo(this.value)">${esc(w.memo||'')}</textarea></div>`;
  }else if(rest){
    h+=`<div class="empty">今日は休んで回復させる日です<br><span class="sub">やる場合は上の「この部位で始める」か「変更」から選べます</span></div>`;
  }

  h+=`<div style="margin-top:14px"><button class="btn" onclick="pickExercise()">＋ 種目を追加</button></div>`;
  if(WO.some(x=>x.date<date&&x.entries.length))
    h+=`<div style="margin-top:9px"><button class="btn ghost" onclick="copyLast()">前回のメニューをコピー</button></div>`;

  /* 完了ボタン。1セットでも記録があるときだけ出す */
  const anyDone=w&&w.entries.some(en=>en.sets.some(s=>s.done));
  if(anyDone&&!w.finished)
    h+=`<div style="margin-top:9px"><button class="btn" style="background:var(--ok)" onclick="finishWorkout()">${isToday?'今日の':'この日の'}トレーニングを完了する</button></div>`;
  return h;
}

/* ============ トレーニングの完了 ============ */
function workoutStats(w){
  let sets=0,vol=0,parts={},prs=[];
  for(const en of w.entries){
    const ex=exById(en.exerciseId);if(!ex)continue;
    for(const s of en.sets){
      if(!s.done)continue;
      sets++;
      if(ex.unit!=='time')vol+=(+s.w||0)*(+s.r||0);
      parts[ex.part]=(parts[ex.part]||0)+1;
    }
  }
  /* この日に自己ベストを更新した種目 */
  for(const en of w.entries){
    const ex=exById(en.exerciseId);if(!ex)continue;
    const b=bestSet(en.exerciseId);
    if(b&&b.date===w.date)prs.push(ex.name+' '+bestLabel(ex,b));
  }
  const mins=w.started&&w.finished?Math.max(1,Math.round((hm2min(w.finished)-hm2min(w.started)))):null;
  return {sets,vol:Math.round(vol),parts,prs,mins};
}
function finishWorkout(){
  const w=getWorkout(VIEW_DATE,true);
  w.finished=nowHM();saveWO();
  showSummary();
}
function unfinishWorkout(){
  const w=getWorkout(VIEW_DATE);if(!w)return;
  delete w.finished;saveWO();Sheet.close();render();
}
function showSummary(){
  const w=getWorkout(VIEW_DATE);if(!w)return;
  const st=workoutStats(w);
  const names=w.entries.map(en=>(exById(en.exerciseId)||{}).name).filter(Boolean);
  const wuDone=(w.wuDone||[]).length;
  let h=`<h3>おつかれさまでした</h3>
    <div class="card" style="text-align:center;padding:20px 13px">
      <div style="font-size:38px;line-height:1">💪</div>
      <div style="font-size:17px;font-weight:700;margin-top:8px">${fmtD(w.date)} 完了</div>
      ${st.mins?`<div class="sub">${w.started} 〜 ${w.finished}（${st.mins}分）</div>`
                :`<div class="sub">${w.finished} に完了</div>`}
    </div>
    <div class="row" style="gap:10px;margin-bottom:11px">
      <div class="card grow" style="margin:0;text-align:center;padding:12px 6px">
        <div class="sub" style="font-size:11px">種目</div><b style="font-size:19px">${names.length}</b></div>
      <div class="card grow" style="margin:0;text-align:center;padding:12px 6px">
        <div class="sub" style="font-size:11px">セット</div><b style="font-size:19px">${st.sets}</b></div>
      <div class="card grow" style="margin:0;text-align:center;padding:12px 6px">
        <div class="sub" style="font-size:11px">ボリューム</div><b style="font-size:19px">${st.vol.toLocaleString()}</b>
        <span class="sub" style="font-size:11px">${CF.unit}</span></div>
    </div>`;
  if(st.prs.length)
    h+=`<div class="card" style="border-color:var(--ok)">
      <b style="font-size:14px">🎉 自己ベスト更新</b>
      <div class="sub" style="margin-top:5px;color:var(--fg)">${st.prs.map(esc).join('<br>')}</div></div>`;
  h+=`<h2 class="sec">内訳</h2><div class="card">
    ${Object.entries(st.parts).map(([p,n])=>
      `<div class="hist"><div class="grow">${esc(p)}</div><b>${n}<span class="sub" style="font-size:11px">セット</span></b></div>`).join('')}
    </div>
    <div class="card"><div class="sub" style="font-size:12.5px">${esc(names.join('・'))}</div></div>`;
  h+=`<div class="card row" style="justify-content:space-between">
    <span class="sub">ウォームアップ／ストレッチ</span><b>${wuDone}<span class="sub" style="font-size:11px">項目</span></b></div>`;
  h+=`<div style="margin-top:14px"><button class="btn" onclick="Sheet.close()">閉じる</button></div>
      <div style="margin-top:9px"><button class="btn ghost" onclick="unfinishWorkout()">完了を取り消す</button></div>`;
  Sheet.open(h);
  render();
}

function changePart(){
  const cur=partLabel(VIEW_DATE);
  Sheet.open(`<h3>${fmtD(VIEW_DATE)}の部位</h3>
    <div class="sub" style="margin-bottom:10px">この日だけ変更します（曜日の設定は変わりません）</div>
    ${DAY_OPTIONS.map(o=>`<div class="pickitem">
      <div class="grow" style="min-width:0"><div class="trunc">${esc(partDisp(o))}</div>
        ${GROUPS[o]?`<div class="sub" style="font-size:11.5px">${GROUPS[o].join('・')}</div>`:''}</div>
      <button class="btn sm ${o===cur?'':'ghost'}" onclick="setPart('${esc(o)}')">${o===cur?'選択中':'選ぶ'}</button></div>`).join('')}`);
}
function setPart(p){
  const w=getWorkout(VIEW_DATE,true);
  if(p===(CF.routine[dObj(VIEW_DATE).getDay()]||'休み'))delete w.partOverride; else w.partOverride=p;
  saveWO();Sheet.close();render();
}
/* part を省略すると、その日のプラン全部を追加する */
function addMenu(part){
  const {plan}=planMenu(partsOf(VIEW_DATE),CF.duration);
  const groups=part?plan.filter(g=>g.part===part):plan;
  if(!groups.length)return;
  const w=getWorkout(VIEW_DATE,true);
  for(const g of groups)for(const it of g.items){
    const ex=exByName(it.name);if(!ex||w.entries.some(e=>e.exerciseId===ex.id))continue;
    const prev=lastRecord(ex.id,VIEW_DATE);
    const arr=[];
    for(let i=0;i<it.sets;i++){const p=prev&&prev.sets[i];arr.push({w:'',r:'',ph:p?{w:p.w,r:p.r}:null,done:false})}
    w.entries.push({exerciseId:ex.id,sets:arr,target:it.sets+'×'+it.rep});
  }
  saveWO();render();
}

function pickExercise(){
  const w=getWorkout(VIEW_DATE),used=w?w.entries.map(e=>e.exerciseId):[];
  const parts=expandParts(partsOf(VIEW_DATE));
  const order=[...parts,...PARTS.filter(p=>!parts.includes(p))];
  let h=`<h3>種目を選ぶ</h3><input id="exq" placeholder="検索…" oninput="filterPick(this.value)" style="margin-bottom:10px"><div id="picklist">`;
  for(const p of order){
    const list=EX.filter(e=>e.part===p);if(!list.length)continue;
    h+=`<div class="pk"><h2 class="sec">${esc(p)}${parts.includes(p)?' ・今日の部位':''}</h2>`;
    for(const e of list){
      const b=bestSet(e.id);
      const al=aliasOf(e.name);
      h+=`<div class="pickitem pk-i" data-n="${esc(e.name)}" data-a="${esc(al.join(' '))}">
        <div class="grow" style="min-width:0"><div class="trunc">${esc(e.name)}</div>
        ${al.length?`<div class="sub trunc" style="font-size:11px;opacity:.85">${esc(al.slice(0,2).join(' ／ '))}</div>`:''}
        ${b?`<div class="sub" style="font-size:11.5px">自己ベスト ${bestLabel(e,b)}</div>`:''}</div>
        <button class="howto" onclick="showGuide('${esc(e.name)}')">やり方</button>
        <button class="btn sm" onclick="addEntry('${e.id}')" ${used.includes(e.id)?'disabled style="opacity:.35"':''}>追加</button></div>`;
    }
